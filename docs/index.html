<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141A18" media="(prefers-color-scheme: dark)">
<meta name="description" content="Tu libreta de ganchillo: patrones vuelta a vuelta, contador y gráficos. Funciona sin conexión.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tejiendo">
<script>window.TI_LOCAL = true;</script>
<title>Tejiendo Ilusiones</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap">
<style>
/* Layout: app de una columna con barra de pestañas abajo (como una app del móvil); fichas con dibujo del gráfico; botones grandes para dedos y vista cansada */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunk:#E9EDE7; --fg:#1F2B27; --muted:#56655F; --line:#D3DBD5;
  --accent:#8A2F5E; --accent-ink:#FFFFFF; --accent-soft:#F6E3EC; --thread:#2C6A63; --thread-ink:#FFFFFF; --thread-soft:#D9ECE8;
  --gold:#B07A1E; --ok:#2E7D4F; --ok-soft:#DDF1E4; --danger:#B3261E;
  --shadow:0 1px 2px rgba(31,43,39,.06),0 6px 20px rgba(31,43,39,.07);
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  --scale:1; --tabs:4.6rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A18; --surface:#1E2724; --sunk:#18201D; --fg:#EEF2EF; --muted:#A7B5AF; --line:#34413C;
  --accent:#E58DBA; --accent-ink:#2A0F1E; --accent-soft:#3B2431; --thread:#7CC7BD; --thread-ink:#0F2420; --thread-soft:#1D3431;
  --gold:#E2B45B; --ok:#7FD39F; --ok-soft:#1E3a2a; --danger:#FF8A80; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A18; --surface:#1E2724; --sunk:#18201D; --fg:#EEF2EF; --muted:#A7B5AF; --line:#34413C;
  --accent:#E58DBA; --accent-ink:#2A0F1E; --accent-soft:#3B2431; --thread:#7CC7BD; --thread-ink:#0F2420; --thread-soft:#1D3431;
  --gold:#E2B45B; --ok:#7FD39F; --ok-soft:#1E3a2a; --danger:#FF8A80; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
html{font-size:calc(20px * var(--scale))}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:1rem;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent}
.wrap{max-width:48rem;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabs) + 2.5rem + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.18;text-wrap:balance;margin:0}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* Barra superior */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .bar{max-width:48rem;margin:0 auto;padding:.5rem 16px;display:flex;align-items:center;gap:.6rem}
.brand{display:flex;align-items:center;gap:.55rem;flex:1;min-width:0;cursor:pointer;background:none;border:0;color:var(--fg);padding:0;text-align:left;min-height:2.6rem;font-weight:400}
.brand span{font-family:var(--display);font-size:1.05rem;line-height:1.1}
.sizer{display:flex;gap:.3rem}
.sizer button{min-width:2.7rem;padding:.2rem .5rem;min-height:2.6rem}

/* Pestañas abajo */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 18px rgba(0,0,0,.05)}
nav.tabs .in{max-width:48rem;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{border:0;border-radius:0;background:none;min-height:var(--tabs);flex-direction:column;gap:.15rem;font-size:.85rem;font-weight:700;color:var(--muted);padding:.35rem .1rem}
nav.tabs button svg{width:1.6rem;height:1.6rem}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:0;width:2.4rem;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs button{position:relative}

/* Botones */
button,.btn{font:inherit;cursor:pointer;border-radius:.75rem;border:2px solid var(--line);background:var(--surface);color:var(--fg);min-height:2.8rem;padding:.4rem 1rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;text-decoration:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.btn:focus-within{outline:3px solid var(--thread);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.teal{background:var(--thread);border-color:var(--thread);color:var(--thread-ink)}
button.soft{background:var(--accent-soft);border-color:transparent;color:var(--fg)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:.3rem}
button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:var(--surface)}
button.big{min-height:3.5rem;font-size:1.1rem;padding-inline:1.3rem}
button.block{width:100%}
button:disabled{opacity:.4;cursor:default}
button svg{flex:none}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
[hidden]{display:none!important}
.videos{margin:.4rem 0 0;font-size:.95rem;line-height:1.6}
.videos a,.gloss a.video{color:var(--accent);font-weight:700}
.gloss a.video{font-size:.9rem;white-space:nowrap}
.pasos-instalar{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:.35rem}
.pasos-instalar a{color:var(--accent);font-weight:700;word-break:break-all}
/* Mis labores: foto a la izquierda y los datos a la derecha, igual que la tarjeta de seguir tejiendo */
.labor{display:grid;grid-template-columns:7.5rem 1fr;gap:1rem;align-items:start;background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.9rem;box-shadow:var(--shadow)}
.labor .thumb{aspect-ratio:1;border-radius:.8rem;overflow:hidden;background:var(--sunk)}
.labor .thumb img{width:100%;height:100%;object-fit:cover}
.labor .info{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.labor h3{margin:0;font-family:var(--display);font-size:1.15rem}
.labor .para{display:flex;align-items:flex-start;gap:.35rem;color:var(--accent);font-weight:700;margin:0}
.labor .para svg{flex:0 0 auto;margin-top:.15em}
.labor p{margin:0}
.labor .nota{font-size:.9rem;white-space:pre-line}
.labor input{width:100%}
@media (max-width:26rem){.labor{grid-template-columns:5.5rem 1fr;gap:.7rem}}
.stack{display:flex;flex-direction:column;gap:1rem}
.section{margin-top:1.8rem;display:flex;flex-direction:column;gap:.8rem}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.back{margin-top:.8rem}
.page-title{margin-top:1.2rem;display:flex;flex-direction:column;gap:.3rem}

/* Inicio */
.hero{margin-top:1.2rem;display:flex;flex-direction:column;gap:.2rem}
.hero h1{font-size:2rem}
.continue{display:grid;grid-template-columns:7.5rem 1fr;gap:1rem;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:1.1rem;padding:.9rem;box-shadow:var(--shadow);text-align:left;cursor:pointer;color:var(--fg);font-weight:400}
.continue .thumb{aspect-ratio:1}
.continue .info{display:flex;flex-direction:column;gap:.35rem;min-width:0}
@media (max-width:26rem){.continue{grid-template-columns:5.5rem 1fr}}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
@media (max-width:34rem){.actions{grid-template-columns:repeat(2,1fr)}.actions > :last-child:nth-child(odd){grid-column:1/-1}}
.action{flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;gap:.5rem;padding:.8rem;min-height:6.2rem;font-weight:700;border-radius:1rem;background:var(--surface);box-shadow:var(--shadow);border-color:transparent;line-height:1.25}
.action .ic{width:2.4rem;height:2.4rem;border-radius:.7rem;display:grid;place-items:center;background:var(--thread-soft);color:var(--thread)}
.action.pink .ic{background:var(--accent-soft);color:var(--accent)}
.action.gold .ic{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.action small{font-weight:400;color:var(--muted);font-size:.8rem}
.tip{background:var(--thread-soft);border-radius:1rem;padding:1rem 1.1rem;display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:start}
.tip svg{color:var(--thread)}

/* Fichas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(14.5rem,1fr));gap:.9rem}
.card{background:var(--surface);border:2px solid transparent;border-radius:1rem;padding:0;display:flex;flex-direction:column;text-align:left;cursor:pointer;color:var(--fg);font-weight:400;overflow:hidden;box-shadow:var(--shadow);align-items:stretch;justify-content:flex-start;min-height:0}
.card:hover{border-color:var(--thread)}
.card .body{padding:.75rem .9rem .9rem;display:flex;flex-direction:column;gap:.4rem}
.card .meta{display:flex;gap:.35rem;flex-wrap:wrap}
.thumb{position:relative;aspect-ratio:16/10;background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--fg);border-radius:.8rem}
.card .thumb{border-radius:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg.chart{width:88%;height:88%}
.thumb .band{position:absolute;inset:auto 0 0 0;height:5px}
.chip{font-size:.78rem;padding:.12rem .6rem;border-radius:99px;background:var(--sunk);color:var(--fg);font-weight:700;white-space:nowrap}
.chip.mine{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.go{background:var(--thread-soft);color:var(--thread)}
.prog{height:.5rem;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--thread);border-radius:99px}
.filters{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem}
.filters button{min-height:2.4rem;border-radius:99px;font-size:.9rem;padding-inline:.9rem;white-space:nowrap}
.filters button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{width:100%;box-sizing:border-box;font:inherit;padding:.75rem 1rem;border:2px solid var(--line);border-radius:.8rem;background:var(--surface);color:var(--fg)}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:1rem;padding:1.4rem;display:flex;flex-direction:column;gap:.6rem;align-items:flex-start}

/* Detalle */
.detail-hero{margin-top:.6rem;display:grid;grid-template-columns:1fr;gap:1rem}
.detail-hero .thumb{aspect-ratio:16/9;border-radius:1rem}
.photo-btn{position:absolute;right:.6rem;bottom:.6rem;min-height:2.4rem;font-size:.85rem;background:color-mix(in srgb,var(--surface) 92%,transparent)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
@media (max-width:34rem){.facts{grid-template-columns:repeat(2,1fr)}}
.fact{background:var(--surface);border-radius:.8rem;padding:.6rem .8rem;display:flex;flex-direction:column;gap:.1rem;min-width:0}
.fact b{font-size:.95rem;overflow-wrap:anywhere}
.fact span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.25rem}
ol.steps li{display:grid;grid-template-columns:2.6rem 1fr;gap:.6rem;padding:.6rem .4rem;border-bottom:1px solid var(--line);border-radius:.5rem;align-items:baseline}
ol.steps li.tap{cursor:pointer}
ol.steps li.tap:hover{background:var(--sunk)}
ol.steps li b{font-family:var(--display);font-weight:400;color:var(--accent);font-size:1.05rem;font-variant-numeric:tabular-nums}
ol.steps li.done{color:var(--muted)}
ol.steps li.done span{text-decoration:line-through;text-decoration-color:var(--line)}
ol.steps li.now{background:var(--accent-soft)}
ol.steps .rev{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-top:.15rem}
ol.steps .rev.ok{color:var(--ok)}
ol.steps .rev.aviso{color:var(--danger)}

/* Tejer */
.stepbox{background:var(--surface);border:3px solid var(--accent);border-radius:1.1rem;padding:1.2rem;display:flex;flex-direction:column;gap:.8rem;box-shadow:var(--shadow)}
.stepbox .txt{font-size:1.5rem;line-height:1.45}
.stepnav{display:grid;grid-template-columns:1fr 1.4fr;gap:.6rem}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:28rem){.counters{grid-template-columns:1fr}}
.counter{background:var(--surface);border-radius:1.1rem;padding:1rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;box-shadow:var(--shadow);border:2px solid transparent}
.counter.match{border-color:var(--ok)}
.counter .num{font-family:var(--display);font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.counter .goal{font-size:.85rem;color:var(--muted);font-weight:700;min-height:1.3em}
.counter.match .goal{color:var(--ok)}
.counter .plus{width:100%;min-height:4.2rem;font-size:2rem;background:var(--thread);border-color:var(--thread);color:var(--thread-ink)}
.counter .small{display:flex;gap:.4rem;width:100%}
.counter .small button{flex:1;font-size:.9rem}
.timer{display:flex;align-items:center;justify-content:space-between;gap:.8rem;background:var(--surface);border-radius:1rem;padding:.6rem .6rem .6rem 1rem;box-shadow:var(--shadow)}
.timer .t{font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums}
textarea,input[type=text],input[type=email],input[type=search],input[type=number],select{font:inherit;width:100%;box-sizing:border-box;padding:.6rem .8rem;border:2px solid var(--line);border-radius:.7rem;background:var(--surface);color:var(--fg)}
textarea{min-height:6rem;resize:vertical;line-height:1.5}
label.f,.f{display:flex;flex-direction:column;gap:.3rem;font-weight:700}
label.f small,.f small{font-weight:400;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media (max-width:30rem){.two{grid-template-columns:1fr}}
.saved{font-size:.85rem;color:var(--ok);min-height:1.3em}
.note{background:var(--thread-soft);border-radius:.9rem;padding:.8rem 1rem}
.panel{background:var(--surface);border-radius:1.1rem;padding:1.1rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.8rem}
.gloss{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1rem;align-items:baseline}
.gloss dt{font-family:var(--display);color:var(--accent);font-size:1.1rem}
.gloss dd{margin:0}
.toast-btn{background:transparent;color:inherit;border:2px solid currentColor;border-radius:99px;min-height:2.2rem;padding:0 .8rem;margin-left:.4rem;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(var(--tabs) + 1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:.6rem 1.2rem;border-radius:99px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){.counter .num.bump{animation:bump .25s ease}@keyframes bump{50%{transform:scale(1.12)}} .view{animation:fade .18s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}}}

/* Gráficos */
.seg{display:inline-flex;border:2px solid var(--line);border-radius:.8rem;overflow:hidden;align-self:flex-start;max-width:100%;background:var(--surface)}
.seg button{border:0;border-radius:0;min-height:2.7rem;font-size:.95rem}
.seg button.sel{background:var(--thread);color:var(--thread-ink)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:.45rem}
.tool{justify-content:flex-start;font-weight:400;font-size:.88rem;text-align:left;padding:.3rem .55rem;line-height:1.2;border-color:var(--line)}
.tool svg{flex:none;color:var(--fg)}
.tool.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:700;box-shadow:inset 0 0 0 1px var(--accent)}
.lanabtn{min-height:2.6rem;padding:.2rem .8rem;font-size:.9rem}
.lanabtn.dot{width:2.6rem;padding:0;border-radius:50%;border-color:color-mix(in srgb,var(--fg) 15%,transparent)}
.lanabtn.sel{outline:3px solid var(--fg);outline-offset:2px}
.lana{display:inline-block;width:1.4rem;height:1.4rem;border-radius:50%;vertical-align:middle;border:1px solid color-mix(in srgb,var(--fg) 15%,transparent)}
.gridwrap{overflow:auto;max-height:75vh;color:var(--fg);background:var(--surface);border-radius:1rem;padding:.5rem;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow)}
.chart{display:block;margin:0 auto;cursor:crosshair}
.chart .cell{fill:var(--surface);stroke:var(--line);stroke-width:1}
.chart .cell.alt{fill:var(--sunk)}
.chart .rowlab{fill:var(--muted);font:700 13px var(--body);font-variant-numeric:tabular-nums}
.chart .hl{fill:none;stroke:var(--accent);stroke-width:3;stroke-opacity:.9}
.chart circle.hl{stroke-opacity:.25}
.chart .ahora{color:var(--accent)}
.chart .ahora g,.chart g.ahora{stroke-width:2.6}
.tejergraf .chart circle.hl{stroke:var(--accent-soft);stroke-opacity:1}
.chart .hole{fill:var(--line)}
.leyenda{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1rem;align-items:center;margin:0;color:var(--fg)}
.leyenda dd{margin:0}
.result{background:var(--accent-soft);border-radius:.9rem;padding:.8rem 1rem;font-size:1.08rem;font-weight:700;display:flex;flex-direction:column;gap:.3rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.menu{display:flex;flex-direction:column;background:var(--surface);border-radius:1.1rem;box-shadow:var(--shadow);overflow:hidden}
.menu button{border:0;border-radius:0;justify-content:flex-start;min-height:3.6rem;padding-inline:1rem;border-bottom:1px solid var(--line);font-weight:700;text-align:left}
.menu button:last-child{border-bottom:0}
.menu button .ic{width:2.2rem;height:2.2rem;border-radius:.6rem;display:grid;place-items:center;background:var(--thread-soft);color:var(--thread);flex:none}
.menu button small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.menu button .grow{flex:1;min-width:0}
.canvasprev{width:100%;height:auto;image-rendering:pixelated;border-radius:.8rem;background:var(--sunk);display:block}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,15,13,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.overlay .box{background:var(--surface);border-radius:1rem;padding:1rem;max-width:40rem;width:100%;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:.8rem}
.overlay .box > *{flex-shrink:0}
.overlay img{width:100%;height:auto;border-radius:.6rem}
.yarnrow{display:grid;grid-template-columns:3rem 1fr auto;gap:.8rem;align-items:center;background:var(--surface);border-radius:1rem;padding:.7rem .9rem;box-shadow:var(--shadow);cursor:pointer;text-align:left;color:var(--fg);font-weight:400;border:2px solid transparent}
.yarnrow:hover{border-color:var(--thread)}
.ball{width:3rem;height:3rem;border-radius:50%;position:relative;overflow:hidden;box-shadow:inset -6px -6px 10px rgba(0,0,0,.18)}
.ball::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.18) 0 2px,transparent 2px 7px)}
.stat{display:flex;gap:.8rem;flex-wrap:wrap}
.stat div{background:var(--surface);border-radius:.9rem;padding:.6rem .9rem;box-shadow:var(--shadow)}
.stat b{font-family:var(--display);font-size:1.4rem;display:block;font-weight:400}
.stat span{font-size:.8rem;color:var(--muted)}

/* Versión sencilla: piezas grandes */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.bigtile{flex-direction:column;gap:.6rem;min-height:8rem;font-size:1.12rem;border-radius:1.1rem;background:var(--surface);border-color:transparent;box-shadow:var(--shadow);text-align:center;line-height:1.25;padding:1rem .6rem}
.bigtile .ic{width:3.6rem;height:3.6rem;border-radius:1rem;display:grid;place-items:center;background:var(--thread-soft);color:var(--thread)}
.bigtile.pink .ic{background:var(--accent-soft);color:var(--accent)}
.bigtile.gold .ic{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}

const KEY = "rincon-ganchillo-v1", FKEY = "rg-foto-";
// Versión del formato de los datos. Al subirla, añade su paso en MIGRACIONES.
// v1: formato original (sin campo v). v2: preferencias del modo sofá y repeticiones por paso.
// v3: cuaderno de labores (lo terminado, para quién y cuándo).
const VERSION_DATOS = 3;
const PREFS = {tejer:"sofa", sonido:true, vibrar:true, auto:true, avisoApp:true, ultCopia:0, copiaDesde:0, copiaPospuesta:0, leer:false, descanso:true, tema:"auto"};
const MIGRACIONES = {
  2: st => { for(const pr of Object.values(st.progreso||{})) if(pr && typeof pr==="object") pr.rep = pr.rep||0; },
  // Lo que ya estaba terminado pasa al cuaderno, sin tocar el progreso ni las fotos (la labor apunta a la foto del patrón)
  3: st => {
    st.labores = Array.isArray(st.labores) ? st.labores : [];
    for(const [id, pr] of Object.entries(st.progreso||{})){
      if(!pr || typeof pr!=="object" || !pr.fin) continue;
      const p = (st.patrones||[]).find(x=>x.id===id);
      st.labores.push({id:"l-"+pr.fin+"-"+id, patron:id, titulo:(p&&p.titulo)||"Una labor", para:"", nota:"", fin:pr.fin, tiempo:pr.tiempo||0, fotoDe:id});
    }
    st.labores.sort((a,b)=>b.fin-a.fin);
  }
};
let state = {patrones:[], progreso:{}, graficos:[], lanas:[], labores:[], apuntes:{}, diario:{}, conFoto:{}, libre:{vueltas:0,puntos:0}, contadores:[], avances:{}, escala:1, t:0, prefs:{...PREFS}, v:VERSION_DATOS};
try{
  const raw = localStorage.getItem(KEY), g = JSON.parse(raw||"null");
  if(g && typeof g==="object"){
    // Antes de migrar, guarda los datos tal cual estaban (una sola vez por versión)
    const vAnt = g.v||1, copia = KEY+"-copia-v"+vAnt;
    if(vAnt<VERSION_DATOS){ try{ if(!localStorage.getItem(copia)) localStorage.setItem(copia, raw); }catch(e){} }
    state = Object.assign(state, g, {v:vAnt});
  }
}catch(e){}
function migrar(st){
  let v = st.v||1;
  while(v<VERSION_DATOS){ v++; MIGRACIONES[v]?.(st); }
  st.v = v;
}
function diaClave(t){ const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
// Cada hora seguida tejiendo en el modo sofá, un aviso suave para descansar las manos.
// Si para más de 10 minutos, ya ha descansado y la cuenta empieza de nuevo.
const DESCANSO_SG = 3600;
let tejiendoSeguido = 0, ultSegundoTejido = 0;
function contarSeguido(ahora=Date.now()){
  if(ahora-ultSegundoTejido > 10*60*1000) tejiendoSeguido = 0;
  ultSegundoTejido = ahora; tejiendoSeguido++;
  if(tejiendoSeguido % DESCANSO_SG === 0 && state.prefs.descanso){
    toast(tejiendoSeguido>DESCANSO_SG ? "Llevas "+Math.round(tejiendoSeguido/3600)+" horas tejiendo. Descansa las manos y la vista un momento." : "Llevas una hora tejiendo. Estira las manos y descansa la vista un momento.");
    if(state.prefs.vibrar) try{ navigator.vibrate?.([80,80,80]); }catch(e){}
  }
}

function unSegundo(pr){ pr.tiempo++; const d=diaClave(Date.now()); state.diario[d]=(state.diario[d]||0)+1; }
const MAX_CONTADORES = 12, MAX_AVANCES = 12;
function normalizarEstado(){
  for(const k of ["patrones","graficos","lanas","labores"]) if(!Array.isArray(state[k])) state[k]=[];
  for(const k of ["progreso","conFoto","libre","prefs","apuntes","diario","avances"]) if(!state[k] || typeof state[k]!=="object" || Array.isArray(state[k])) state[k]={};
  // Fotos del avance: {patrón: [{k, t, paso}]}; la imagen va aparte, como las demás fotos
  for(const [id, xs] of Object.entries(state.avances)){
    state.avances[id] = Array.isArray(xs) ? xs.filter(x=>x && typeof x.k==="string" && x.k.startsWith("av-")).map(x=>({k:x.k, t:+x.t||0, paso:Math.max(0,+x.paso||0)})).slice(-MAX_AVANCES) : [];
    if(!state.avances[id].length) delete state.avances[id];
  }
  state.libre.vueltas = state.libre.vueltas||0; state.libre.puntos = state.libre.puntos||0;
  // Contadores con nombre (además del principal, que sigue en state.libre)
  if(!Array.isArray(state.contadores)) state.contadores = [];
  state.contadores = state.contadores.filter(c=>c && typeof c==="object").slice(0, MAX_CONTADORES).map((c,i)=>({id:String(c.id||"c-"+i), nombre:String(c.nombre||"").slice(0,40), vueltas:Math.max(0,+c.vueltas||0), puntos:Math.max(0,+c.puntos||0)}));
  state.prefs = {...PREFS, ...state.prefs};
  // Tiempo tejido por día (para «Tu semana»): solo se guarda el último año
  const limite = diaClave(Date.now()-400*864e5);
  for(const d of Object.keys(state.diario)) if(!(d>=limite) || typeof state.diario[d]!=="number") delete state.diario[d];
  if(!state.prefs.copiaDesde) state.prefs.copiaDesde = Date.now(); // desde cuándo cuenta el recordatorio de copia
  state.graficos.forEach(g=>{ if(!Array.isArray(g.celdas) || !g.celdas.length) g.celdas=[Array(10).fill("")]; g.cols = g.cols || g.celdas[0].length || 10; });
  // El color va a un estilo: solo se acepta un color de verdad (una copia de seguridad la puede haber tocado cualquiera)
  const colorOk = c => typeof c==="string" && /^#[0-9a-f]{3,8}$/i.test(c);
  state.patrones.forEach((p,i)=>{ if(p && p.color!=null && !colorOk(p.color)) p.color = COLORES[i % COLORES.length]; });
  state.lanas.forEach(l=>{ if(l && l.color!=null && !colorOk(l.color)) l.color = "#8A9594"; });
  migrar(state);
}

const fotosCache = {}, fotosPedidas = new Set();
function fotoRef(id){ return db && uid ? db.doc("data/users/"+uid+"/estado/fotos/"+id) : null; }
function fotoGet(id){
  if(!state.conFoto[id]) return null;
  if(fotosCache[id]) return fotosCache[id];
  let v=null; try{ v=localStorage.getItem(FKEY+id); }catch(e){}
  if(v){ fotosCache[id]=v; return v; }
  nubeFotoPedir(id);
  const ref = fotoRef(id);
  if(ref && !fotosPedidas.has(id)){
    fotosPedidas.add(id);
    ref.get().then(sn=>{ if(sn.exists && sn.data().img){ fotosCache[id]=sn.data().img; try{ localStorage.setItem(FKEY+id, fotosCache[id]); }catch(e){} render(); } }).catch(()=>{});
  }
  return null;
}
async function fotoSet(id, data){
  if(data){ fotosCache[id]=data; state.conFoto[id]=true; try{ localStorage.setItem(FKEY+id, data); }catch(e){ toast("La foto no cabe en este aparato. Prueba con otra más pequeña."); } }
  else { delete fotosCache[id]; delete state.conFoto[id]; try{ localStorage.removeItem(FKEY+id); }catch(e){} }
  save(); nubeFotoGuardar(id, data);
  const ref = fotoRef(id);
  if(ref){ try{ data ? await ref.set({img:data}) : await ref.delete(); }catch(e){} }
}
function leerImagen(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("img")); im.src=r.result; };
    r.onerror=()=>rej(new Error("read")); r.readAsDataURL(file);
  });
}
async function comprimir(file, max=760){
  const im = await leerImagen(file);
  const k = Math.min(1, max/Math.max(im.width, im.height));
  const c = document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg", .74);
}
function elegirFoto(id, alTerminar){
  const inp = h("input",{type:"file", accept:"image/*", style:"display:none"});
  inp.onchange = async ()=>{ const f=inp.files[0]; inp.remove(); if(!f) return; try{ await fotoSet(id, await comprimir(f)); toast("Foto guardada"); alTerminar&&alTerminar(); }catch(e){ toast("No he podido abrir esa foto. Prueba con otra."); } };
  document.body.append(inp); inp.click();
}

// Fotos del avance de una labor: pequeñas (caben muchas) y con la fecha y el paso en que iba
function anadirAvance(p, alTerminar){
  const xs = state.avances[p.id] || [];
  if(xs.length>=MAX_AVANCES){ toast("Ya tienes "+MAX_AVANCES+" fotos de este patrón. Quita alguna para poner otra."); return; }
  const inp = h("input",{type:"file", accept:"image/*", style:"display:none"});
  inp.onchange = async ()=>{
    const f = inp.files[0]; inp.remove(); if(!f) return;
    try{
      const k = "av-"+p.id+"-"+Date.now(), data = await comprimir(f, 520);
      await fotoSet(k, data);
      let ok = false; try{ ok = localStorage.getItem(FKEY+k)===data; }catch(e){}
      if(!ok){ fotoSet(k, null); return; }
      const pr = state.progreso[p.id];
      state.avances[p.id] = [...(state.avances[p.id]||[]), {k, t:Date.now(), paso: pr ? pr.paso : 0}];
      save(); toast("Foto del avance guardada"); alTerminar && alTerminar();
    }catch(e){ toast("No he podido abrir esa foto. Prueba con otra."); }
  };
  document.body.append(inp); inp.click();
}
function quitarAvance(p, x){
  state.avances[p.id] = (state.avances[p.id]||[]).filter(y=>y.k!==x.k);
  if(!state.avances[p.id].length) delete state.avances[p.id];
  fotoSet(x.k, null);
}

}

// ---------- Utilidades ----------
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="class") el.className=v;
    else if(k==="style") el.style.cssText=v;
    else el.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}

  if(t==="claro" || t==="oscuro"){ r.dataset.theme = t==="oscuro" ? "dark" : "light"; r.dataset.temaPropio = "1"; }
  else if(r.dataset.temaPropio){ r.removeAttribute("data-theme"); delete r.dataset.temaPropio; }
}

  }}, label);

}

    }
    for(let i=0;i<Math.min(n,60);i++) fila.push(...cuerpo);

const ESCRITO = {am:"anillo mágico", aumpa:"aum de pa", pbt:"pb hebra de atrás", rel:"pa en relieve", pina:"piña", garb:"garbanzo", picot:"picot"};

function filaATexto(f){
  const ks = f.map(pk).filter(Boolean);
  if(!ks.length) return "";
  if(ks.every(k=>k==="am")) return "Anillo mágico";
  const rle = arr => { const runs=[]; for(const k of arr){ const l=runs[runs.length-1]; if(l && l.k===k) l.n++; else runs.push({k,n:1}); } return runs; };
  const fmt = r => r.n+" "+(ESCRITO[r.k]||r.k);
  // Busca el trozo que se repite (permitiendo unos puntos sueltos al principio y al final)
  let best=null;
  for(let a=0;a<=Math.min(3,ks.length);a++) for(let b=0;b<=Math.min(3,ks.length-a);b++){
    const mid = ks.slice(a, ks.length-b);
    for(let p=1;p<=mid.length/2;p++){
      if(mid.length%p) continue;
      let ok=true; for(let i=p;i<mid.length;i++) if(mid[i]!==mid[i%p]){ ok=false; break; }
      if(ok){ const unidad=rle(mid.slice(0,p)); const score=unidad.length*2+a+b; if(!best || score<best.score) best={a,b,p,score,veces:mid.length/p,unidad}; break; }
    }
  }
  let partes;
  if(best && best.veces>1 && best.unidad.length>1){
    partes = [...rle(ks.slice(0,best.a)).map(fmt), "*"+best.unidad.map(fmt).join(", ")+"* repetir "+best.veces+" veces", ...rle(ks.slice(ks.length-best.b)).map(fmt)];
  } else partes = rle(ks).map(fmt);
  const total = ks.reduce((a,k)=>a+anchoDe(k),0);
  return partes.join(", ") + (total ? " ("+total+")" : "");
}

function repartir(a, b){
  a=Math.round(a); b=Math.round(b);
  if(!(a>0) || !(b>0)) return "Escribe cuántos puntos tienes y cuántos quieres.";
  if(a===b) return "No hace falta cambiar nada: teje 1 pb en cada punto. ("+b+")";
  if(b>a){
    const inc=b-a;
    if(inc>a) return "Son demasiados aumentos para una sola vuelta. Como mucho puedes llegar a "+(2*a)+" (1 aum en cada punto). Repártelo en dos vueltas.";
    if(inc===a) return "1 aum en cada punto. ("+b+")";
    const q=Math.floor(a/inc), r=a%inc;
    const g1 = (q-1? (q-1)+" pb, ":"")+"1 aum", g2 = q+" pb, 1 aum";
    return (r ? "*"+g1+"* repetir "+(inc-r)+" veces, después *"+g2+"* repetir "+r+" veces." : "*"+g1+"* repetir "+inc+" veces.")+" ("+b+")";
  }
  const dec=a-b;
  if(dec*2>a) return "Son demasiadas disminuciones para una sola vuelta. Como mucho puedes bajar a "+Math.ceil(a/2)+". Repártelo en dos vueltas.";
  const q=Math.floor(a/dec), r=a%dec;
  const g1 = (q-2? (q-2)+" pb, ":"")+"1 dism", g2 = (q-1)+" pb, 1 dism";
  return (r ? "*"+g1+"* repetir "+(dec-r)+" veces, después *"+g2+"* repetir "+r+" veces." : "*"+g1+"* repetir "+dec+" veces.")+" ("+b+")";
}

  const W = 2*gut + cols*z + 2, H = filas*z + 2;

  if(exp) svg.setAttribute("color", EXP.ink);
  let n = 0;
  for(let r=0;r<filas;r++){
    const y = (filas-1-r)*z + 1;   // la vuelta 1 queda abajo, como en las revistas
    const fila = g.celdas[r], am = soloAnillo(fila), tiene = hayPunto(fila);

    if(marcar && marcar.fila===r){
      const orden = [...Array(cols).keys()].filter(c=>pk(fila[c]));
      estadoCol = {}; orden.forEach((c,i)=>{ estadoCol[c] = i<marcar.hechos ? "hecho" : i===marcar.hechos ? "siguiente" : ""; });

      if(exp) { lab.setAttribute("fill", EXP.lab); lab.setAttribute("font-family","Arial, sans-serif"); lab.setAttribute("font-size","13"); lab.setAttribute("font-weight","700"); }

    for(let c=0;c<cols;c++){

        else if(pk(v)) svg.append(simbolo(pk(v), x, y, z));

      const cell = s("rect",{x, y, width:z, height:z});
      if(exp){ cell.setAttribute("fill", r%2?EXP.alt:EXP.cell); cell.setAttribute("stroke", EXP.line); } else cell.setAttribute("class", r%2?"cell alt":"cell");
      svg.append(cell);
      if(col>=0) svg.append(s("rect",{x:x+1.5, y:y+1.5, width:z-3, height:z-3, rx:3, fill:LANAS[col][0], "fill-opacity":.75, stroke:"#000", "stroke-opacity":.18, "stroke-width":.8}));
      if(estadoCol && estadoCol[c]) svg.append(s("rect",{x:x+2, y:y+2, width:z-4, height:z-4, rx:4, class:"marca "+estadoCol[c]}));
      if(pk(v)){ const sy = simbolo(pk(v), x, y, z, exp?EXP.ink:undefined); if(colorHL && esHL(r)) sy.classList.add("ahora"); if(estadoCol && estadoCol[c]) sy.classList.add(estadoCol[c]); svg.append(sy); }
    }

  }
  const celda = ev => {
    const rect = svg.getBoundingClientRect(), esc = rect.width / W;
    const c = Math.floor(((ev.clientX-rect.left)/esc - gut - 1)/z), rv = Math.floor(((ev.clientY-rect.top)/esc - 1)/z), r = filas-1-rv;

function dibujarRedondo(g, {ancho=360, resaltar=-1, exp=false, mini=false, zMini=22, minStep=14, fantasma=false, colorHL=false, marcar=null}={}){
  const esHL = r => Array.isArray(resaltar) ? resaltar.includes(r) : r===resaltar;
  const anillos=[]; let k=0;
  g.celdas.forEach((f,r)=>{ if(soloAnillo(f)) anillos.push({r, centro:true}); else if(hayPunto(f) || !mini){ k++; anillos.push({r, k, n:largoFila(f)}); } });
  const K = Math.max(1,k), pad = mini ? 2 : 12;
  const step = mini ? zMini*1.15 : Math.max(minStep, Math.min(48, (Math.min(ancho,1400)/2 - pad)/(K+0.6)));
  const Rmax = step*(K+0.6), W = Math.ceil(2*(Rmax+pad)), C = W/2;
  const svg = s("svg",{width:W, height:W, viewBox:`0 0 ${W} ${W}`, class:"chart", role:"img", "aria-label":"Gráfico en redondo, "+K+" vueltas"});
  const ink = exp ? EXP.ink : undefined;
  if(!mini){
    for(let i=K;i>=1;i--){ const c = s("circle",{cx:C, cy:C, r:step*(i+0.4)+step/2}); if(exp){ c.setAttribute("fill", i%2?EXP.cell:EXP.alt); c.setAttribute("stroke",EXP.line); } else c.setAttribute("class", i%2?"cell":"cell alt"); svg.append(c); }
    const c0 = s("circle",{cx:C, cy:C, r:step*0.9}); if(exp){ c0.setAttribute("fill",EXP.cell); c0.setAttribute("stroke",EXP.line); } else c0.setAttribute("class","cell"); svg.append(c0);
  }
  const info=[];
  for(const a of anillos){
    if(a.centro){
      if(esHL(a.r) && !mini) svg.append(s("circle",{cx:C, cy:C, r:step*.48, class:"hl"}));
      celdaRedonda(g.celdas[a.r].find(v=>pk(v))||"am", C, C, 0, step*.9, svg, ink, colorHL && esHL(a.r));
      info.push({...a}); continue;
    }
    const nd = a.n + (fantasma?1:0);
    const R = step*(a.k+0.4), sa = 360/(Math.max(nd,1)+0.8);
    const zz = Math.max(mini?2:9, Math.min(step*.92, 2*Math.PI*R/(Math.max(nd,1)+0.8)*.92));
    if(esHL(a.r) && !mini) svg.append(s("circle",{cx:C, cy:C, r:R, class:"hl", "stroke-width":step*.9}));
    const fila = g.celdas[a.r];
    let j = 0; // puntos con símbolo ya dibujados en esta vuelta, para marcar los hechos en el modo sofá
    for(let i=0;i<a.n;i++){
      const ang = -90 + (i+0.9)*sa, rad = ang*Math.PI/180;
      const px = C + R*Math.cos(rad), py = C + R*Math.sin(rad);
      const est = marcar && marcar.fila===a.r && pk(fila[i]) ? (j<marcar.hechos ? "hecho" : j===marcar.hechos ? "siguiente" : "") : "";
      if(pk(fila[i])) j++;
      if(est) svg.append(s("circle",{cx:px, cy:py, r:zz*.5, class:"marca "+est}));
      if(pk(fila[i]) || pcol(fila[i])>=0){ celdaRedonda(fila[i], px, py, ang+90, zz, svg, ink, colorHL && esHL(a.r)); if(est) svg.lastElementChild.classList.add(est); }
      else if(!mini) svg.append(s("circle",{cx:px, cy:py, r:2, class:"hole", fill: exp?EXP.line:null}));
    }
    if(fantasma){
      // Hueco con "+" al final de cada vuelta: tocarlo añade el punto elegido
      const ang = -90 + (a.n+0.9)*sa, rad = ang*Math.PI/180, px = C + R*Math.cos(rad), py = C + R*Math.sin(rad), rr = Math.max(9, zz*.42);
      svg.append(s("circle",{cx:px, cy:py, r:rr, class:"ghost"}));
      const t = s("text",{x:px, y:py+rr*.45, "text-anchor":"middle", class:"ghostplus", style:"font-size:"+(rr*1.3)+"px"}); t.textContent="+"; svg.append(t);
    }
    if(!mini){
      const lab = s("text",{x:C, y:C-R+4, "text-anchor":"middle", class:"rowlab", style:"font-size:"+Math.min(13, step*.42)+"px"});
      if(exp){ lab.setAttribute("fill",EXP.lab); lab.setAttribute("font-family","Arial, sans-serif"); lab.setAttribute("font-weight","700"); }
      lab.textContent = String(a.k); svg.append(lab);
    }
    info.push({...a, R, sa, nd});
  }
  svg.dataset.c = C; svg.dataset.step = step;
  const celda = ev => {
    const rect = svg.getBoundingClientRect(), esc = rect.width / W;
    const dx = (ev.clientX-rect.left)/esc - C, dy = (ev.clientY-rect.top)/esc - C, d = Math.hypot(dx,dy);
    if(d < step*.5){ const c = info.find(a=>a.centro); return c ? [c.r,0] : (fantasma ? [-1,0] : null); }
    let a=null, best=Infinity; for(const x of info){ if(x.centro) continue; const dd=Math.abs(d-x.R); if(dd<best){ best=dd; a=x; } }
    if(!a || best > step*0.75) return null;
    const ang = ((Math.atan2(dy,dx)*180/Math.PI + 90) % 360 + 360) % 360;
    const i = Math.round(ang/a.sa - 0.9);
    return [a.r, Math.max(0, Math.min((a.nd||a.n)-1, i))];
  };
  return {svg, celda};
}
function celdaRedonda(v, px, py, rot, zz, parent, ink, ahora=false){
  const gg = s("g",{transform:`translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${rot.toFixed(1)})`});
  if(ahora) gg.setAttribute("class","ahora");
  const c = pcol(v);
  if(c>=0) gg.append(s("circle",{cx:0, cy:0, r:zz*.48, fill:LANAS[c][0], "fill-opacity":.75, stroke:"#000", "stroke-opacity":.18, "stroke-width":.8}));
  if(pk(v)) gg.append(simbolo(pk(v), -zz/2, -zz/2, zz, ink));
  parent.append(gg);
}

// ---------- Miniaturas ----------
const miniCache = {};
// Un patrón con partes (cuerpo, pies, alas…) tiene un gráfico por parte. Sin decir cuál, el de la primera.
function parteDe(p, i){
  const pasos = p.pasos; if(!pasos.some(esParte)) return null;
  let m = -1; for(let k=Math.min(i, pasos.length-1); k>=0; k--) if(esParte(pasos[k])){ m = k; break; }
  if(m<0) return {ini:0, fin:pasos.findIndex(esParte), marca:-1};
  let fin = pasos.findIndex((t,k)=>k>m && esParte(t)); if(fin<0) fin = pasos.length;
  return {ini:m+1, fin, marca:m};
}
function subPatron(p, parte){ return {...p, id:p.id+"#"+parte.ini, pasos:p.pasos.slice(parte.ini, parte.fin), grafico:undefined, lanaInicial: parte.marca>=0 ? lanaEnPaso(p, parte.marca) : null}; }
// La lana con la que se teje en el paso i: la de su parte o el último «Cambia a la lana …»
function lanaEnPaso(p, i){
  for(let k=Math.min(i, p.pasos.length-1); k>=0; k--){
    const t = p.pasos[k];
    const m = esParte(t) ? t.match(/· con (.+)$/) : esCambioLana(t) ? t.match(/^cambia a la lana (.+?)\.?$/i) : null;
    if(m){ const c = COLORES_LANA.find(([rx])=>rx.test(m[1])); return {nombre:m[1].trim(), hex:c ? c[2] : null}; }
    if(esParte(t)) return null;
  }
  return null;
}
function graficoDePatron(p){
  if(p.grafico){ const g = state.graficos.find(x=>x.id===p.grafico); if(g) return g; }
  const parte = parteDe(p, 0);
  if(parte) return parte.fin>parte.ini ? graficoDePatron(subPatron(p, parte)) : null;
  const src = p.pasos.join("\n")+"|"+(p.lanaInicial ? p.lanaInicial.nombre : "");
  if(miniCache[p.id] && miniCache[p.id].src===src) return miniCache[p.id].g;
  const g = {cols:10, celdas:[], vista:"filas"};
  const ok = graficoDesdeTexto(g, p.pasos.join("\n"), true);
  if(ok) colorearGrafico(g, p.pasos, p.lanaInicial);
  miniCache[p.id] = {src, g: ok ? g : null};
  return ok ? g : null;
}
// ---------- Puntos del color de su lana ----------
// Del nombre de un color («gris», «anaranjado», «blanca») al color de lana del gráfico
const LANA_DE = {rojo:0, fucsia:6, rosa:6, naranja:1, amarillo:2, verde:3, turquesa:12, celeste:12, azul:4, lila:5, "marrón":7, beige:13, crudo:13, gris:8, negro:10, blanco:9};
function lanaIndice(nombre){ const c = COLORES_LANA.find(([rx])=>rx.test(nombre||"")); return c && LANA_DE[c[1]]!=null ? LANA_DE[c[1]] : -1; }
// Trozos de una vuelta por color: «2 cad, 3 pa, con blanco: 10 pa, con gris: 3 pa» → gris 5, blanco 10, gris 3
// ---------- Lanas que pide un patrón y las que hay en casa ----------
// Todos los colores que nombra un texto, en orden: «gris, blanca y anaranjada» → gris, blanco, naranja
function coloresEnTexto(t){
  return COLORES_LANA.map(c=>({c, m:(t||"").match(c[0])})).filter(x=>x.m).sort((a,b)=>a.m.index-b.m.index).map(x=>x.c);
}
function lanasDelPatron(p){
  const out = [], poner = c => { if(c && !out.some(x=>x[1]===c[1])) out.push(c); };
  coloresEnTexto(p.hilo).forEach(poner);
  for(const t of p.pasos){
    const m = esParte(t) ? t.match(/· con (.+)$/) : esCambioLana(t) ? t.match(/^cambia a la lana (.+?)\.?$/i) : null;
    if(m) coloresEnTexto(m[1]).slice(0,1).forEach(poner);
    for(const x of coloresDelPaso(t)) coloresEnTexto(x.nombre).slice(0,1).forEach(poner);
  }
  return out.map(([, nombre, hex])=>({nombre, hex}));
}
const rgb = hex => { const n = parseInt(String(hex||"").replace("#","").slice(0,6), 16); return [n>>16&255, n>>8&255, n&255]; };
function lanaMasParecida(hex){
  const [r,g,b] = rgb(hex); let mejor = -1, d = Infinity;
  LANAS.forEach(([c],i)=>{ const [R,G,B] = rgb(c), x = (r-R)**2+(g-G)**2+(b-B)**2; if(x<d){ d=x; mejor=i; } });
  return mejor;
}
// ¿Hay en «Mis lanas» una de ese color? Por el nombre («Algodón gris») o, si no lo dice, por el color elegido
function tengoLana(nombre){
  return state.lanas.some(l => { const porNombre = coloresEnTexto(l.nombre); return porNombre.length ? porNombre.some(x=>x[1]===nombre || LANA_DE[x[1]]===LANA_DE[nombre]) : l.color && lanaMasParecida(l.color)===LANA_DE[nombre]; });
}
const yLista = xs => xs.length<2 ? xs.join("") : xs.slice(0,-1).join(", ")+" y "+xs[xs.length-1];
function cajaLanas(p){
  const pide = lanasDelPatron(p); if(!pide.length) return null;
  const faltan = pide.filter(c=>!tengoLana(c.nombre));
  const sinCesta = !state.lanas.length;
  return h("div",{class:"panel lanas-patron stack", style:"gap:.55rem"},
    h("div",{class:"eyebrow"},"Lanas que necesitas"),
    h("div",{class:"row", style:"gap:.4rem"}, pide.map(c=>{ const tiene = !faltan.includes(c);
      return h("span",{class:"chip lana-chip"+(sinCesta ? "" : tiene ? " ok" : " falta")}, h("i",{style:"background:"+c.hex}), c.nombre, sinCesta ? null : h("span",{"aria-hidden":"true"}, tiene ? " ✓" : " ✗")); })),
    h("p",{}, sinCesta ? "Necesitas "+yLista(pide.map(c=>c.nombre))+". Apunta en «Mis lanas» lo que tienes en casa y te digo si te falta alguna."
      : !faltan.length ? "Las tienes todas en «Mis lanas»."
      : "Necesitas "+yLista(pide.map(c=>c.nombre))+". No tienes "+yLista(faltan.map(c=>c.nombre))+"."),
    sinCesta ? h("button",{onclick:()=>go({name:"lanas"})},"Ir a Mis lanas")
      : faltan.length ? h("div",{class:"row", style:"gap:.4rem"}, faltan.map(c=>h("button",{onclick:()=>go({name:"lana", nombre:"Lana "+c.nombre, color:LANAS[LANA_DE[c.nombre]] ? LANAS[LANA_DE[c.nombre]][0] : c.hex, vuelta:{name:"patron", id:p.id}})}, "＋ Ya tengo "+c.nombre))) : null);
}
function trozosDeColor(t, actual){
  const rx = /\bcon\s+(?:la\s+lana\s+|lana\s+|el\s+)?([\p{L}]{3,15})\s*:?/giu;
  const cortes = [...t.matchAll(rx)].filter(m=>lanaIndice(m[1])>=0);
  if(!cortes.length) return null;
  const trozos = []; let desde = 0, col = actual;
  for(const m of cortes){ trozos.push({col, txt:t.slice(desde, m.index)}); col = lanaIndice(m[1]); desde = m.index + m[0].length; }
  trozos.push({col, txt:t.slice(desde)});
  return trozos.map(x=>({col:x.col, n:((lineaAFilas("Vuelta 1: "+x.txt.replace(/^[^:]*(?:vueltas?|filas?|hileras?)\s*\d+[^:]*:/i, ""))[0])||[]).filter(v=>pk(v)).length}));
}
// Pinta cada punto del gráfico con la lana con la que se teje. Solo si el patrón dice colores (partes con
// «con gris», «Cambia a la lana …» o «con blanco: …» dentro de una vuelta); si no, el gráfico queda como estaba.
function colorearGrafico(g, pasos, inicial){
  let actual = inicial ? lanaIndice(inicial.nombre) : -1;
  if(actual<0 && !pasos.some(t=>esCambioLana(t) || trozosDeColor(t, -1))) return;
  const porLinea = pasos.map(t=>lineaAFilas(t).length), total = porLinea.reduce((a,b)=>a+b,0);
  let fila = g.celdas.length===total+1 && soloAnillo(g.celdas[0]) ? 1 : 0; // anillo del centro puesto por el gráfico
  if(fila) g.celdas[0] = g.celdas[0].map(v=>pk(v) && actual>=0 ? pk(v)+"@"+actual : v);
  const pintar = (row, cols) => row.map((v,i)=>pk(v) && cols[i]>=0 ? pk(v)+"@"+cols[i] : v);
  pasos.forEach((t,k)=>{
    if(esCambioLana(t)){ const m = t.match(/^cambia a la lana (.+?)\.?$/i); const c = m ? lanaIndice(m[1]) : -1; if(c>=0) actual = c; return; }
    const trozos = trozosDeColor(t, actual);
    for(let r=0; r<porLinea[k]; r++){
      const row = g.celdas[fila++]; if(!row) return;
      const conPunto = row.map((v,i)=>pk(v)?i:-1).filter(i=>i>=0);
      const cols = Array(row.length).fill(actual);
      if(trozos && trozos.reduce((a,x)=>a+x.n,0)===conPunto.length){ let j=0; for(const x of trozos) for(let q=0;q<x.n;q++) cols[conPunto[j++]] = x.col; }
      g.celdas[fila-1] = pintar(row, cols);
    }
    if(trozos) actual = trozos[trozos.length-1].col;
  });
}
function miniatura(g, color){
  const box = h("div",{class:"thumb"});
  if(g && g.celdas.some(hayPunto)){
    // Se dibuja grande y se recorta por el centro, para que los puntos se vean de cerca
    const sv = dibujarGrafico(g, {mini:true, zMini: g.modo==="color" ? 8 : 22}).svg;
    sv.removeAttribute("width"); sv.removeAttribute("height"); sv.style.cursor="inherit";
    sv.setAttribute("preserveAspectRatio", g.modo==="color" ? "xMidYMid meet" : "xMidYMid slice");
    if(g.vista==="redondo" && sv.dataset.step){ const C=+sv.dataset.c, st=+sv.dataset.step, R=st*3.7; if(R < C) sv.setAttribute("viewBox", (C-R)+" "+(C-R)+" "+(2*R)+" "+(2*R)); }
    else if(g.modo!=="color"){ const W=+sv.viewBox.baseVal.width, H=+sv.viewBox.baseVal.height, lado=Math.min(W,H,22*7); sv.setAttribute("viewBox", "0 "+(H-lado)+" "+Math.min(W,lado*1.3)+" "+lado); }
    sv.setAttribute("class","chart cover");
    box.append(sv);
  } else box.append(ovillo(color||"#2C6A63"));
  if(color) box.append(h("i",{class:"band", style:"background:"+color}));
  return box;
}
function ovillo(color){
  const v = s("svg",{viewBox:"0 0 100 100", class:"ovillo", "aria-hidden":"true"});
  v.append(s("circle",{cx:50, cy:50, r:34, fill:color}));

  ["M20 40c18 8 42 8 60 0","M17 54c20 9 46 9 66 0","M24 68c16 6 36 6 52 0","M38 18c12 18 14 44 4 66","M58 17c10 20 10 46-2 66"].forEach(d=>g.append(s("path",{d})));
  v.append(g, s("path",{d:"M78 74c8 6 12 10 14 16", stroke:color, "stroke-width":3, fill:"none", "stroke-linecap":"round"}));

}
function miniaturaPatron(p){
  const f = fotoGet(p.id);
  if(f){ const box=h("div",{class:"thumb"}, h("img",{src:f, alt:"Foto de "+p.titulo})); box.append(h("i",{class:"band", style:"background:"+(p.color||"#2C6A63")})); return box; }

// ---------- Exportar imagen ----------

  const items = [...usados.map(x=>({k:x.k, t:x.n})), ...lanas.map(([l])=>({c:l[0], t:"Lana "+l[1]}))];
  const W = Math.max(cw+80, 680), colsLeg = Math.max(1, Math.floor((W-80)/310)), legRows = Math.ceil(items.length/colsLeg);
  const top = 120, H = top + ch + 70 + legRows*46 + 60;

function nuevoGrafico(datos){

}
function graficoDesdeTexto(g, texto, cambiarVista){
  const filas = textoAFilas(texto);
  if(!filas.length) return false;
  const cols = Math.min(120, Math.max(10, ...filas.map(f=>f.length)));
  g.cols = cols; g.celdas = filas.map(f=>{ const r=f.slice(0,cols); while(r.length<cols) r.push(""); return r; });
  // «Vuelta 1: 6 pb en anillo mágico» también es en redondo: se pone el anillo en el centro
  const primera = (texto.split("\n").find(l=>l.trim()) || "").toLowerCase();
  if(cambiarVista && filas[0][0]!=="am" && /anillo\s+m[aá]gico|anillo\s+amigurumi/.test(primera)){
    g.celdas.unshift(["am", ...Array(cols-1).fill("")]);
  }
  if(cambiarVista) g.vista = g.celdas[0][0]==="am" ? "redondo" : "filas";
  return true;
}
function patronDesdeGrafico(g){
  const pasos = graficoATexto(g).split("\n").filter(Boolean);
  if(!pasos.length) return null;
  const p = {id:"m-"+Date.now(), titulo:g.nombre||"Mi gráfico", descripcion:"Hecho a partir de mi gráfico.", nivel:"Fácil", hilo:"", ganchillo:"", notas:"", pasos, color:COLORES[state.patrones.length % COLORES.length], grafico:g.id};
  state.patrones.unshift(p); save(); return p;
}
function leyendaDe(g){
  const usados = SIMBOLOS.filter(x=>g.celdas.some(f=>f.some(v=>pk(v)===x.k)));
  const cuenta = k => g.celdas.reduce((a,f)=>a+f.filter(v=>pk(v)===k).length,0);
  const lanas = LANAS.map((l,i)=>[l,i]).filter(([l,i])=>g.celdas.some(f=>f.some(v=>pcol(v)===i)));
  const cuentaL = i => g.celdas.reduce((a,f)=>a+f.filter(v=>pcol(v)===i).length,0);
  if(!usados.length && !lanas.length) return [h("dd",{class:"muted", style:"grid-column:1/-1"},"Todavía no hay puntos. Toca el gráfico para dibujar.")];
  return [
    ...usados.flatMap(x=>[h("dt",{},iconoSimbolo(x.k,30)), h("dd",{}, x.n+"  ", h("span",{class:"muted"},"× "+cuenta(x.k)))]),
    ...lanas.flatMap(([l,i])=>[h("dt",{}, h("span",{class:"lana", style:"background:"+l[0]})), h("dd",{},"Lana "+l[1]+"  ", h("span",{class:"muted"},"× "+cuentaL(i)))])
  ];
}

// ---------- Compartir una labor: una tarjeta en imagen, sin cuentas ni enviar nada a ningún sitio ----------
function dibujarTexto(cx, texto, x, y, ancho, alto, max){
  const palabras = String(texto||"").split(/\s+/).filter(Boolean), lineas = [];
  let linea = "";
  for(const w of palabras){
    const prueba = linea ? linea+" "+w : w;
    if(cx.measureText(prueba).width > ancho && linea){ lineas.push(linea); linea = w; } else linea = prueba;
    if(lineas.length === max) break;
  }
  if(linea && lineas.length < max) lineas.push(linea);
  lineas.forEach((l,i)=>cx.fillText(l, x, y + i*alto));
  return y + lineas.length*alto;
}
async function tarjetaLaborImagen(l){
  const W = 1080, H = 1350, M = 72;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#F2F4EF"; cx.fillRect(0,0,W,H);
  // La foto (o el gráfico del patrón) en un cuadrado redondeado
  const lado = W - M*2, arriba = M;
  cx.save(); cx.beginPath(); cx.roundRect(M, arriba, lado, lado, 40); cx.clip();
  const src = fotoDeLabor(l);
  let puesta = false;
  if(src){
    const img = new Image();
    await new Promise((ok,mal)=>{ img.onload=ok; img.onerror=mal; img.src=src; }).catch(()=>{});
    if(img.width){
      const k = Math.max(lado/img.width, lado/img.height), aw = img.width*k, ah = img.height*k;
      cx.drawImage(img, M+(lado-aw)/2, arriba+(lado-ah)/2, aw, ah); puesta = true;
    }
  }
  if(!puesta){ // sin foto, el ovillo de la app sobre fondo rosa, para que la tarjeta no salga vacía
    cx.fillStyle = "#F6E3EC"; cx.fillRect(M, arriba, lado, lado);
    const z = lado/34*0.55, ox = M+lado/2-17*z, oy = arriba+lado/2-17*z;
    cx.save(); cx.translate(ox, oy); cx.scale(z, z);
    cx.fillStyle = "#8A2F5E"; cx.beginPath(); cx.arc(17, 17, 13, 0, Math.PI*2); cx.fill();
    cx.strokeStyle = "rgba(255,255,255,.75)"; cx.lineWidth = 1.6; cx.lineCap = "round";
    cx.save(); cx.beginPath(); cx.arc(17, 17, 13, 0, Math.PI*2); cx.clip();
    cx.stroke(new Path2D("M6 13c7 3 15 3 22 0M5 19c8 3 16 3 24 0M10 7c5 7 6 14 4 22M20 5c3 8 3 16 0 24"));
    cx.restore();
    cx.strokeStyle = "#2C6A63"; cx.lineWidth = 3; cx.stroke(new Path2D("M27 27l5 5"));
    cx.restore();
  }
  cx.restore();
  let y = arriba + lado + 92;
  cx.fillStyle = "#1F2B27"; cx.textBaseline = "alphabetic";
  cx.font = "58px Georgia, serif";
  y = dibujarTexto(cx, l.titulo || "Mi labor", M, y, W-M*2, 70, 2) + 14;
  if(l.para){ cx.fillStyle = "#8A2F5E"; cx.font = "bold 40px Arial, sans-serif"; cx.fillText("Para "+l.para, M, y); y += 56; }
  cx.fillStyle = "#56655F"; cx.font = "32px Arial, sans-serif";
  cx.fillText(fechaTxt(l.fin) + (l.tiempo>3600 ? " · "+Math.round(l.tiempo/3600)+" h tejidas" : ""), M, y);
  cx.fillStyle = "#8A968F"; cx.font = "26px Arial, sans-serif";
  cx.fillText("Hecho a mano con Tejiendo Ilusiones", M, H-M);
  return cv;
}
// Compartir donde se pueda: con el botón del móvil, descargando, o enseñándola para mantener el dedo encima
async function entregarImagen(cv, nombre, titulo){
  const blob = await new Promise(r=>cv.toBlob(r, "image/png"));
  if(blob && navigator.canShare){
    const archivo = new File([blob], nombre+".png", {type:"image/png"});
    if(navigator.canShare({files:[archivo]})){
      try{ await navigator.share({files:[archivo], title:titulo}); return; }
      catch(e){ if(e && e.name==="AbortError") return; }
    }
  }
  try{
    const dl = window.claude?.use ? await claude.use("downloads") : null;
    if(dl && blob){ await dl.save({filename:nombre+".png", data:blob}); toast("Imagen guardada"); return; }
  }catch(e){ if(e && e.code==="declined") return; }
  if(window.TI_LOCAL && blob){
    const url = URL.createObjectURL(blob);
    const a = h("a",{href:url, download:nombre+".png", hidden:true});
    document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 10000);
    toast("Imagen guardada en Descargas"); return;
  }
  mostrarImagen(cv.toDataURL("image/png"), titulo);
}
async function compartirLabor(l){
  toast("Preparando la imagen…");
  const cv = await tarjetaLaborImagen(l);
  const nombre = (l.titulo||"labor").replace(/[^\p{L}\p{N} _-]/gu,"").trim().slice(0,60) || "labor";
  await entregarImagen(cv, nombre, l.titulo || "Mi labor");
}

// ---------- «Teje este patrón»: mandar un patrón con un enlace ----------
// El patrón va dentro del enlace, después de «#», así que no pasa por ningún servidor (ni siquiera por GitHub):
// solo lo ven quien lo manda y quien lo abre. Al abrirlo se enseña antes de guardarlo; nunca se guarda solo.
const APP_URL = "https://parolo2000.github.io/tejiendo-ilusiones/";
const ENLACE_MAX = 60000; // caracteres del enlace; un patrón normal ocupa unos pocos miles
const b64url = bytes => { let t=""; for(const b of bytes) t+=String.fromCharCode(b); return btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const desdeB64url = str => { const t = atob(str.replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(t, c=>c.charCodeAt(0)); };
async function comprimirTexto(texto){
  const datos = new TextEncoder().encode(texto);
  if(typeof CompressionStream!=="function") return "0"+b64url(datos);
  const comp = await new Response(new Blob([datos]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer();
  return "1"+b64url(new Uint8Array(comp));
}
async function descomprimirTexto(cod){
  const datos = desdeB64url(cod.slice(1));
  if(cod[0]==="0") return new TextDecoder().decode(datos);
  if(cod[0]!=="1" || typeof DecompressionStream!=="function") throw new Error("formato");
  // Se corta a 200 KB descomprimidos: un enlace no puede convertirse en algo enorme
  const lector = new Blob([datos]).stream().pipeThrough(new DecompressionStream("deflate-raw")).getReader();
  const trozos = []; let total = 0;
  for(;;){ const {done, value} = await lector.read(); if(done) break; total += value.length; if(total>200000){ lector.cancel(); throw new Error("grande"); } trozos.push(value); }
  return new TextDecoder().decode(await new Blob(trozos).arrayBuffer());
}
async function enlaceDePatron(p){
  const datos = {v:1, t:p.titulo, p:p.pasos, g:p.ganchillo||"", h:p.hilo||"", n:p.nivel||"", d:p.descripcion||"", o:p.notas||""};
  const base = window.TI_LOCAL ? location.origin+location.pathname : APP_URL;
  return base+"#patron="+await comprimirTexto(JSON.stringify(datos));
}
// Solo se aceptan textos y con límites: lo que venga en un enlace puede haberlo escrito cualquiera
function validarPatronRecibido(d){
  const txt = (v, max) => typeof v==="string" ? v.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,"").trim().slice(0, max) : "";
  if(!d || typeof d!=="object" || !Array.isArray(d.p)) return null;
  const pasos = d.p.slice(0, 400).map(x=>txt(x, 1500)).filter(Boolean);
  const titulo = txt(d.t, 120);
  if(!titulo || !pasos.length) return null;
  return {titulo, pasos, ganchillo:txt(d.g, 40), hilo:txt(d.h, 120), nivel:txt(d.n, 40), descripcion:txt(d.d, 600), notas:txt(d.o, 3000)};
}
async function leerEnlace(hash){
  const m = /^#patron=([A-Za-z0-9_-]+)$/.exec(hash||"");
  if(!m || m[1].length > ENLACE_MAX) return null;
  try{ return validarPatronRecibido(JSON.parse(await descomprimirTexto(m[1]))); }catch(e){ return null; }
}
async function enviarPatron(p){
  let url;
  try{ url = await enlaceDePatron(p); }catch(e){ toast("No he podido preparar el enlace."); return; }
  if(url.length > ENLACE_MAX){ toast("Este patrón es demasiado largo para mandarlo con un enlace."); return; }
  const texto = "Te mando el patrón «"+p.titulo+"». Ábrelo para tejerlo vuelta a vuelta:";
  if(navigator.share){
    try{ await navigator.share({title:p.titulo, text:texto, url}); return; }
    catch(e){ if(e && e.name==="AbortError") return; }
  }
  mostrarEnlace(p, url, texto);
}
function mostrarEnlace(p, url, texto){

  }}, "Copiar el enlace");

    h("div",{class:"box"},

// Los puntos de una vuelta dibujados en grande, para ir tocando por dónde vas
// El gráfico del patrón tal como va: las vueltas hechas y la de ahora resaltada.
// Con «rep» (modo sofá) se ve solo hasta la vuelta exacta en la que está, dentro de un paso de varias vueltas.
function graficoEnCurso(p, pr, rep=null){
  // Con partes, el gráfico es solo el de la parte en la que está (cada parte empieza otra vez en la vuelta 1)
  const parte = !p.grafico && p.pasos.length ? parteDe(p, Math.min(pr.paso, p.pasos.length-1)) : null;
  if(parte){
    const ini = parte.marca===pr.paso ? pr.paso+1 : parte.ini;
    const par = ini===parte.ini ? parte : parteDe(p, ini);
    if(par.fin>par.ini) return graficoEnCurso(subPatron(p, par), {...pr, paso:Math.max(0, pr.paso-par.ini), rep: parte.marca===pr.paso ? 0 : pr.rep}, parte.marca===pr.paso ? null : rep);
  }
  const n = p.pasos.length, terminado = pr.paso>=n;
  const graf = graficoDePatron(p);
  let filasCon = graf ? graf.celdas.map((f,i)=>hayPunto(f)?i:-1).filter(i=>i>=0) : [];
  let cuentas = p.pasos.map(t=>lineaAFilas(t).length);
  // El anillo del centro puesto por el gráfico («6 pb en anillo mágico») no es una vuelta: se ve siempre
  let centro = null;
  if(filasCon.length && soloAnillo(graf.celdas[filasCon[0]]) && cuentas.reduce((x,y)=>x+y,0)===filasCon.length-1){ centro = filasCon[0]; filasCon = filasCon.slice(1); }
  if(cuentas.reduce((x,y)=>x+y,0)!==filasCon.length) cuentas = p.pasos.map((t,i)=>i<filasCon.length?1:0);
  const desde = cuentas.slice(0, Math.min(pr.paso,n)).reduce((x,y)=>x+y,0);
  let hasta = terminado ? filasCon.length : desde + (cuentas[pr.paso]||0);
  let ahora = terminado ? [] : filasCon.slice(desde, hasta);
  if(rep!=null && ahora.length){ const i = Math.min(rep, ahora.length-1); ahora = [ahora[i]]; hasta = desde+i+1; }
  const visibles = new Set(filasCon.slice(0, Math.max(hasta,1)));
  if(centro!=null) visibles.add(centro);
  const grafOk = filasCon.length>0;
  const ultimaVisible = Math.max(...visibles, 0);
  const parcial = grafOk ? {...graf, celdas: graf.celdas.slice(0, ultimaVisible+1).map((f,i)=>visibles.has(i) ? f : f.map(()=>""))} : null;
  return {graf, parcial, ahora, grafOk};
}
// Cuántos símbolos de la vuelta están ya hechos según los puntos contados. Un aumento son 2 puntos, por eso no
// basta con contar símbolos. Si la cuenta del patrón no cuadra con los símbolos, se reparte en proporción.
function simbolosHechos(fila, puntos, objetivo){
  const ks = fila.map(pk).filter(Boolean);
  const anchos = ks.map(k=>anchoDe(k)), total = anchos.reduce((a,b)=>a+b,0);
  if(!ks.length) return 0;
  if(!total) return Math.min(ks.length, puntos);
  const llevo = objetivo ? puntos*total/objetivo : puntos;
  let suma = 0, hechos = 0;
  // Una cadeneta de subida (no cuenta como punto) se da por hecha en cuanto se teje el punto siguiente
  for(const a of anchos){ if(a ? suma + a <= llevo + 1e-9 : llevo > suma + 1e-9){ suma += a; hechos++; } else break; }
  return hechos;
}

}

const corriendo = {};

// ---------- Modo sofá: la lógica (sin pantalla, para poder probarla sola) ----------
// Cada paso del patrón es de uno de estos tipos:
//  "puntos": lleva el total entre paréntesis → se cuentan puntos y la vuelta pasa sola al cuadrar
//  "hasta":  "repite… hasta que mida…" → se cuentan vueltas hasta que ella diga que ya está
//  "accion": lo demás (anillo mágico, cortar el hilo…) → un toque y al paso siguiente
const UNIDADES = ["puntos","punto","grupos","grupo","pétalos","picos","abanicos","conchas","cadenetas","cad"];
function infoPaso(texto){
  texto = texto||"";
  const ult = [...texto.matchAll(/\((\d+)\s*([a-záéíóúñ]*)[^)]*\)/gi)].pop();
  const palabra = ult ? ult[2].toLowerCase() : "";
  const medida = /^(cm|mm|m|g|gr|gramos|metros)$/.test(palabra);
  let objetivo = medida ? 0 : objetivoDe(texto), implicito = false;
  // «Filas 11 a 18: 60 pb» o «Fila 35: Teje 6 dism»: sin total entre paréntesis, el total son esos mismos puntos
  if(!objetivo && !ult && RX_VUELTA.test(texto.trim()) && !/\bhasta\b/i.test(texto)){
    const cuerpo = texto.replace(/^[^:]*:\s*/, "");
    if(/^\s*(teje\s+)?(por la hebra de (atr[aá]s|delante)\s*)?(y\s+teje\s+)?((\d+\s*(pb|pa|mpa|pbt|pad|aum|dism)\b)[,\s]*(y\s+)?)+\.?\s*$/i.test(cuerpo)){
      const f = lineaAFilas(texto)[0]; const n = f ? f.reduce((a,k)=>a+anchoDe(k),0) : 0;
      if(n>0){ objetivo = n; implicito = true; }
    }
  }
  const modo = objetivo>0 ? "puntos" : /\bhasta\b/.test(normalizar(texto)) ? "hasta" : "accion";
  const ini = texto.match(/^\s*(?:vueltas?|v|rnd|round|row|filas?|hileras?|r)\s*(\d+)/i) || texto.match(/^\s*(\d+)\s*[ªº°]\s*(?:vueltas?|filas?|hileras?)/i);
  return {
    modo, objetivo, implicito,
    reps: modo==="puntos" ? Math.max(1, lineaAFilas(texto).length) : 1,
    vuelta: ini ? +ini[1] : 0,
    unidad: UNIDADES.includes(palabra) ? (palabra==="cad" ? "cadenetas" : palabra) : "puntos",
    // Los patrones planos dicen «Fila 1» en vez de «Vuelta 1»: se le habla con su misma palabra
    fila: /^\s*(?:\d+\s*[ªº°]\s*)?(?:filas?|hileras?|rows?)\b/i.test(texto)
  };
}
// Un toque en la mitad de abajo. Cambia pr y dice qué ha pasado: "punto" | "vuelta" | "paso" | "fin"
function sofaTocar(pr, pasos, prefs){
  const info = infoPaso(pasos[pr.paso]);
  if(info.modo==="accion") return sofaSiguientePaso(pr, pasos.length, pasos);
  if(info.modo==="hasta"){ pr.vueltas=(pr.vueltas||0)+1; pr.rep=(pr.rep||0)+1; return "vuelta"; }
  pr.puntos=(pr.puntos||0)+1;
  if(pr.puntos < info.objetivo || !prefs.auto) return "punto";
  return sofaVueltaHecha(pr, pasos);
}
// La vuelta de ahora está terminada (sola al cuadrar, o porque ella lo dice)
function sofaVueltaHecha(pr, pasos){
  const info = infoPaso(pasos[pr.paso]);
  pr.vueltas=(pr.vueltas||0)+1; pr.puntos=0;
  if((pr.rep||0)+1 < info.reps){ pr.rep=(pr.rep||0)+1; return "vuelta"; }
  return sofaSiguientePaso(pr, pasos.length, pasos);
}
// Una parte que se teje varias veces («PIES (hacer 2)»): al acabar la primera pieza se vuelve a su vuelta 1
function piezasDe(pasos, i){
  const parte = parteDe({pasos}, i);
  return parte && parte.marca>=0 ? {...parte, veces:vecesDe(pasos[parte.marca])} : null;
}
function sofaSiguientePaso(pr, n, pasos){
  const pz = pasos && piezasDe(pasos, pr.paso);
  if(pz && pz.veces>1 && pr.paso>=pz.ini && pr.paso+1>=pz.fin && (pr.pieza||0)+1<pz.veces){
    pr.pieza=(pr.pieza||0)+1; pr.paso=pz.ini; pr.puntos=0; pr.rep=0; return "pieza";
  }
  pr.paso=Math.min(n, pr.paso+1); pr.puntos=0; pr.rep=0;
  if(pasos && esParte(pasos[pr.paso])) pr.pieza=0;
  if(pr.paso>=n){ pr.fin=Date.now(); return "fin"; }
  return "paso";
}
function sofaPasoAnterior(pr, pasos){
  const pz = piezasDe(pasos, pr.paso);
  if(pz && pr.pieza>0 && pr.paso===pz.ini){ pr.pieza--; pr.paso=pz.fin-1; }
  else pr.paso=Math.max(0, pr.paso-1);
  pr.puntos=0; pr.rep=0; delete pr.fin;
}
// Lo que tiene de especial un paso, para avisar antes de llegar: color, parte nueva, punto que no ha salido aún…
function ojoDelPaso(pasos, i){
  const t = pasos[i]; if(t==null) return null;
  const iv = infoPaso(t), v = iv.vuelta, en = v ? "En la "+(iv.fila ? "fila " : "vuelta ")+v : "En el siguiente paso";
  if(esParte(t)) return "Después empieza otra parte: "+t.replace(/^parte:\s*/i, "").replace(/\s*·\s*/, ", ");
  if(esCambioLana(t)) return "Después cambias a la lana "+t.replace(/^cambia a la lana /i, "").replace(/\.$/, "");
  const cols = coloresDelPaso(t); if(cols.length) return en+" se cambia de color: "+yLista(cols.map(c=>c.nombre));
  if(/hebra de (atrás|delante)/i.test(t)) return en+" se teje por la hebra de "+t.match(/hebra de (atrás|delante)/i)[1];
  if(/\brellen/i.test(t)) return en+" toca rellenar";
  if(/\b(cose|coser|une|unir)\b/i.test(t)) return en+" toca coser o unir";
  const antes = new Set(pasos.slice(0, i).flatMap(puntosDelPaso));
  const basicos = ["cad","pd","am"], yaTeje = [...antes].some(k=>!basicos.includes(k));
  const nuevos = yaTeje ? puntosDelPaso(t).filter(k=>!antes.has(k) && !basicos.includes(k)) : [];
  if(nuevos.length) return en+" sale un punto nuevo: "+yLista(nuevos.map(k=>NOMBRE[k]||k));
  return null;
}
// ---------- Cuánto te falta ----------
// Puntos que quedan (con las piezas que se repiten) y, con su ritmo de verdad, el tiempo que queda
function puntosDeUnPaso(t){ const info = infoPaso(t); return info.modo==="puntos" ? info.objetivo*info.reps : 0; }
function puntosQueQuedan(pasos, pr){
  const n = pasos.length; let total = 0, hasta = false;
  for(let i=pr.paso||0; i<n; i++){
    if(infoPaso(pasos[i]).modo==="hasta") hasta = true;
    let x = puntosDeUnPaso(pasos[i]);
    if(i===(pr.paso||0) && x){ const info = infoPaso(pasos[i]); x = Math.max(0, info.objetivo*(info.reps-(pr.rep||0)) - (pr.puntos||0)); }
    total += x;
  }
  // Las piezas que faltan de cada parte que se hace varias veces
  for(let i=0; i<n; i++) if(esParte(pasos[i])){
    const pz = piezasDe(pasos, i+1); if(!pz || pz.marca!==i || pz.veces<2) continue;
    const dentro = (pr.paso||0)>=pz.ini && (pr.paso||0)<pz.fin, antes = (pr.paso||0)<=pz.marca;
    const extra = antes ? pz.veces-1 : dentro ? pz.veces-1-(pr.pieza||0) : 0;
    if(extra>0) total += extra*pasos.slice(pz.ini, pz.fin).reduce((a,t)=>a+puntosDeUnPaso(t), 0);
  }
  return {puntos:total, hasta};
}
function cuantoFalta(p, pr){
  if(!pr || pr.paso>=p.pasos.length) return null;
  const queda = puntosQueQuedan(p.pasos, pr), todo = puntosQueQuedan(p.pasos, {paso:0}).puntos, hecho = todo - queda.puntos;
  if(!queda.puntos) return null;
  const fmt = n => n.toLocaleString("es-ES");
  let tiempo = "";
  if(hecho>=20 && (pr.tiempo||0)>=120){
    const sg = Math.round(pr.tiempo/hecho*queda.puntos/300)*300, hh = Math.floor(sg/3600), mm = Math.round(sg%3600/60);
    tiempo = sg<300 ? "menos de 5 minutos" : (hh ? "unas "+hh+" h"+(mm ? " "+mm+" min" : "") : "unos "+mm+" minutos");
  }
  return "Te quedan unos "+fmt(queda.puntos)+" puntos"+(tiempo ? ", "+tiempo+" a tu ritmo" : "")+(queda.hasta ? " (más lo de «hasta que mida»)" : "")+".";
}

// Leer el paso en voz alta con la voz del propio móvil (gratis y sin internet en la mayoría de móviles)
const DICHO = [[/\bpbt\b/gi,"punto bajo por la hebra de atrás"],[/\bpb\b/gi,"punto bajo"],[/\bmpa\b/gi,"medio punto alto"],[/\bpad\b/gi,"punto alto doble"],
  [/\bpa\b/gi,"punto alto"],[/\bpd\b/gi,"punto deslizado"],[/\baum\b/gi,"aumento"],[/\bdism\b/gi,"disminución"],[/\bcad\b/gi,"cadeneta"],[/\bAM\b/g,"anillo mágico"],
  [/\*/g,""],[/\bx\s*(\d+)/gi,"$1 veces"],[/\((\d+)\)/g,". Al final, $1 puntos."]];
const paraDecir = t => DICHO.reduce((a,[rx,r])=>a.replace(rx,r), String(t||"")).replace(/\s+/g," ").trim();
const puedeHablar = () => typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined";
function leerEnVoz(t){
  if(!puedeHablar()) return false;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(paraDecir(t)); u.lang = "es-ES"; u.rate = 0.9;
    const voz = speechSynthesis.getVoices().find(v=>/^es(-|_|$)/i.test(v.lang)); if(voz) u.voice = voz;
    speechSynthesis.speak(u); return true;
  }catch(e){ return false; }
}
function pitar(notas){
  if(!state.prefs.sonido) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = audioCtx.currentTime;
    for(const [f,ini,dur] of notas){
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, t0+ini); g.gain.exponentialRampToValueAtTime(0.2, t0+ini+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+ini+dur);
      o.connect(g).connect(audioCtx.destination); o.start(t0+ini); o.stop(t0+ini+dur+0.05);
    }
  }catch(e){}
}
function vibrar(patron){ if(state.prefs.vibrar && navigator.vibrate){ try{ navigator.vibrate(patron); }catch(e){} } }

const PUNTOS_EN = {
  us: {"sl st":"pd", "slst":"pd", "ss":"pd", "ch":"cad", "sc":"pb", "hdc":"mpa", "dc":"pa", "tr":"pad", "trc":"pad", "inc":"aum", "dec":"dism", "sc2tog":"dism", "invdec":"dism", "dc2tog":"dism"},

const PALABRAS_EN = {the:"", a:"", an:"", into:"en", in:"en", to:"hasta", space:"espacio", sp:"espacio", corner:"esquina", ring:"anillo", ball:"bola", same:"mismo", next:"siguiente", more:"más", with:"con", first:"primer", last:"último", end:"final", beginning:"principio", each:"cada", and:"y", then:"después", of:"de"};

function esIngles(texto){
  const en = (texto.match(/\b(sc|dc|hdc|htr|ch|rnds?|rounds?|stitch(es)?|sts|sl ?st|magic ring|repeat|each|around|fasten off)\b/gi)||[]).length;
  const es = (texto.match(/\b(pb|pa|mpa|cad|vueltas?|filas?|puntos?|cadenetas?|aumentos?|anillo)\b/gi)||[]).length;
  return en >= 2 && en > es;

function esUK(texto){ return /\b(htr|dtr|uk terms?|british)\b/i.test(texto) || (/\bdc\b/i.test(texto) && /\btr\b/i.test(texto) && !/\bsc\b/i.test(texto)); }
function traducirIngles(linea, uk){
  const mapa = PUNTOS_EN[uk ? "uk" : "us"];
  let t = " "+linea+" ";
  t = t.replace(/(\d)(sc|dc|hdc|htr|ch|tr|dtr)\b/gi, "$1 $2")                                      // 2sc → 2 sc
       .replace(/[\[(]([^\])]*[a-z][^\])]*)[\])]\s*(?:x\s*(\d+)|(\d+)\s*times)/gi, "*$1* repetir $2$3 veces") // (sc, inc) x6
       .replace(/\*([^*]+?)[;,]?\s*rep(?:eat)? from \*\s*(\d+)\s*more times/gi, (m,a,n)=>"*"+a+"* repetir "+(+n+1)+" veces")
       .replace(/\*([^*]+?)[;,]?\s*rep(?:eat)? from \*\s*(\d+)\s*times/gi, "*$1* repetir $2 veces")
       .replace(/\*([^*]+?)[;,]?\s*rep(?:eat)? from \*\s*(around|to end|across)?/gi, "*$1* ")
       .replace(/\b(sc|dc|hdc|htr|tr|dtr)\s+in\s+(?:the\s+)?next\s+(\d+)\s*(?:sts?|stitches)?\b/gi, "$2 $1") // sc in next 3 sts
       .replace(/\b(ch|sc|dc|hdc|htr|tr|dtr)\s+(\d+)\b(?!\s*(?:sts?|stitches|times))/gi, "$2 $1")       // ch 3 → 3 ch
       .replace(/[\[(]\s*(\d+)\s*(?:sts?|stitches|puntos)?\s*[\])]/gi, "($1)")                            // [12] / (12 sts)
       .replace(/\s[-–—=]\s*(\d+)\s*(?:sts?|stitches)\.?\s*$/i, " ($1) ");                                  // – 12 sts
  // «Row» es fila (labor plana) y «Round» es vuelta (en redondo)
  t = t.replace(/\b(rows)\s*(\d+)\s*(?:-|–|to|and|&)\s*(\d+)/gi, "Filas $2 al $3")
       .replace(/\b(rnds|rounds)\s*(\d+)\s*(?:-|–|to|and|&)\s*(\d+)/gi, "Vueltas $2 al $3")
       .replace(/\b(row)\s*(\d+)/gi, "Fila $2")
       .replace(/\b(rnd|round|r)\s*(\d+)/gi, "Vuelta $2")
       .replace(/\b(join|close)( the round)? with (a )?(sl ?st|ss)\b/gi, "cierra con pd")
       .replace(/\b(magic (ring|circle|loop)|mr)\b/gi, "anillo mágico")
       .replace(/\b(fasten off|fo)\b/gi, "corta el hilo")
       .replace(/\bweave in (the |all )?ends\b/gi, "esconde las hebras")
       .replace(/\bstuff(ing)?\b/gi, "rellena")
       .replace(/\bturn\b/gi, "gira")
       .replace(/\bcounts? as (a |one |1 )?/gi, "cuenta como 1 ")
       .replace(/\b(back loop only|blo)\b/gi, "por la hebra de atrás")
       .replace(/\b(front loop only|flo)\b/gi, "por la hebra de delante")
       .replace(/\bin (each|every) (st|stitch|sc|dc|ch|ch-sp)\b/gi, "en cada punto")
       .replace(/\b(?:in )?(?:the )?(\d+)(?:st|nd|rd|th) (ch|chain) from (the )?hook\b/gi, "en la $1ª cad")
       .replace(/\bin (each|every) (ch|chain)\b/gi, "en cada cad")
       .replace(/\s+across\b/gi, "")
       .replace(/\bin (the )?same (st|stitch)\b/gi, "en el mismo punto")
       .replace(/\bin (the )?next (st|stitch)\b/gi, "en el siguiente")
       .replace(/\b(sk|skip)\b/gi, "salta");

  t = t.replace(/\b(repeat|rep)\b/gi, "repetir").replace(/\btimes\b/gi, "veces").replace(/\b(all )?around\b/gi, "alrededor")
       .replace(/\b(stitches|sts)\b/gi, "puntos").replace(/\bst\b/gi, "punto");
  t = t.replace(/\b(the|a|an|into|in|to|space|sp|corner|ring|ball|same|next|more|with|first|last|end|beginning|each|and|then|of)\b/gi, m => PALABRAS_EN[m.toLowerCase()]);

}
const RX_VUELTA = /^(?:vueltas?|v|rnds?|rounds?|rows?|r|filas?|hileras?)\s*\d+/i;

const esVueltaDeVerdad = l => RX_VUELTA.test(l) && (/^[A-ZÁÉÍÓÚ]/.test(l) || /^\S+\s*\d+(?:\s*(?:a|al|y|-|–)\s*\d+)?\s*:/.test(l));

// ---------- Vueltas con ordinal, partes y colores ----------
// «1ª vuelta:», «16ª vuelta», «1era vuelta», «5ª a 10ª vuelta», «de la 5ª a la 10ª vuelta» → «Vuelta 1:», «Vueltas 5 a 10:»
// «Fila» se queda como «Fila» (los patrones planos la usan); «hilera» es lo mismo que fila
const PALABRA_VUELTA = w => /^vuelta/i.test(w) ? "Vuelta" : "Fila";

    .replace(new RegExp("^\\s*(?:de\\s+la\\s+)?(\\d+)"+O+"\\s*(?:a\\s+la|a|al|-|–|y)\\s*(\\d+)"+O+"\\s*(vuelta|fila|hilera)s?\\s*[:.)-]?\\s*", "i"), (m,a,b,w)=>PALABRA_VUELTA(w)+"s "+a+" a "+b+": ")
    .replace(new RegExp("^\\s*(\\d+)"+O+"\\s*(vuelta|fila|hilera)\\s*[:.)-]?\\s*", "i"), (m,a,w)=>PALABRA_VUELTA(w)+" "+a+": ")

// Líneas de leyenda («Pto = punto», «pb = punto bajo»): van a las notas, no son pasos
const esLeyenda = l => /^\s*[\p{L}.\s]{1,20}\s*=\s*\p{L}/u.test(l);
// Cabecera de una parte del muñeco: «CUERPO», «PIES (hacer 2)», «Alas (hacer 2)», «Cabeza:»
// «(hacer 2)», «(2 piezas)», «(make 2)», «(x2)», «(2 детали)»: cuántas veces se teje esa parte
const RX_VECES = /\s[xх×]\s*(\d+)\s*$|\((?:hacer|haz|tejer|teje|make|связать)\s*(\d+)(?:\s*(?:veces|piezas|times|pieces|шт\.?))?\)|\((\d+)\s*(?:piezas|veces|pieces|times|детали|деталей|шт\.?)\)|\(\s*[xх×]\s*(\d+)\s*\)/iu;
function vecesDe(t){ const m = (t||"").replace(/\s*·\s*con .+$/, "").match(RX_VECES); return m ? Math.max(1, Math.min(20, +(m[1]||m[2]||m[3]||m[4]))) : 1; }
const NO_PARTES = /^(materiales?|abreviaturas?|notas?|necesitas|necesitar[aá]s|tambi[eé]n necesitar[aá]s|medidas?|tama[ñn]o|montaje|armado|instrucciones|leyenda|puntos y abreviaturas|puntos? (usados|utilizados)|puntos y)\b/i;

function cabeceraSin(t){

function lineaDeColor(l){

  const c = COLORES_LANA.find(([rx])=>rx.test(m[1]));

const esParte = t => /^parte:/i.test(t||"");

function coloresDelPaso(t){

function traducirLatino(l){

}

const cargando = {};
function cargarScript(src){
  return cargando[src] = cargando[src] || new Promise((ok, mal)=>{
    const sc = document.createElement("script"); sc.src = src;
    sc.onload = ok; sc.onerror = ()=>{ delete cargando[src]; sc.remove(); mal(new Error("sin-conexion")); };
    document.head.append(sc);

async function paginasComoImagen(doc, max){
  const imgs = [];
  for(let n=1; n<=Math.min(doc.numPages, max); n++){
    const pag = await doc.getPage(n), vp0 = pag.getViewport({scale:1});
    const vp = pag.getViewport({scale: Math.min(3, 2000/Math.max(vp0.width, vp0.height))});
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
    await pag.render({canvasContext:ctx, viewport:vp}).promise;
    imgs.push(c); pag.cleanup();
  }
  return imgs;
}

async function prepararFoto(archivo){

  const k = Math.min(1, 2400/Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  return c;
}

  const prueba = await fetch(OCR_DIR+"worker.min.js", {method:"HEAD"}).catch(()=>null);
  if(!prueba || !prueba.ok) throw new Error("no-arranca");

  let plazo; const tarde = new Promise((_, mal)=>{ plazo = setTimeout(()=>mal(new Error("no-arranca")), 120000); });

    errorHandler: ()=>{}
