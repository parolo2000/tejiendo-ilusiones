// Una página a dos columnas: el lector a veces junta la línea de la izquierda con la de la derecha. Con la
// posición de cada palabra se busca el hueco vertical entre columnas y se lee primero una y luego la otra.
function textoEnColumnas(d, ancho){
  const lineas = []; let par = 0;
  for(const b of d.blocks||[]) for(const p of b.paragraphs||[]){ par++; for(const l of p.lines||[]){ const ws = (l.words||[]).filter(w=>w && w.text && w.text.trim() && w.bbox); if(ws.length){ ws.par = par; lineas.push(ws); } } }
  const palabras = lineas.flat(); if(palabras.length<30 || !ancho) return null;
  let mejor = null;
  for(let x=Math.round(ancho*.3); x<=ancho*.7; x+=Math.max(2, Math.round(ancho/200))){
    const cruzan = palabras.filter(w=>w.bbox.x0<x && w.bbox.x1>x).length;
    const izq = palabras.filter(w=>w.bbox.x1<=x).length, der = palabras.length-izq-cruzan;
    if(izq<palabras.length*.2 || der<palabras.length*.2) continue;
    if(!mejor || cruzan<mejor.cruzan) mejor = {x, cruzan};
  }
  if(!mejor || mejor.cruzan > Math.max(2, palabras.length*.03)) return null;
  // Las líneas que cruzan el hueco (títulos centrados) van arriba; luego la columna izquierda y después la derecha
  const lado = (ws, f) => ws.filter(f).sort((a,b)=>a.bbox.x0-b.bbox.x0).map(w=>w.text).join(" ");
  const arriba = [], izq = [], der = [];
  for(const ws of lineas){
    if(ws.some(w=>w.bbox.x0<mejor.x && w.bbox.x1>mejor.x)){ arriba.push({y:ws[0].bbox.y0, t:lado(ws, ()=>true), p:"a"+ws.par}); continue; }
    const y = ws[0].bbox.y0, a = lado(ws, w=>w.bbox.x1<=mejor.x), b = lado(ws, w=>w.bbox.x0>=mejor.x);
    if(a) izq.push({y, t:a, p:"i"+ws.par}); if(b) der.push({y, t:b, p:"d"+ws.par});
  }
  // Entre párrafos, una línea en blanco: así se sabe dónde acaba una vuelta larga
  const orden = xs => { const o = xs.sort((a,b)=>a.y-b.y), out = []; o.forEach((x,i)=>{ if(i && x.p!==o[i-1].p) out.push(""); out.push(x.t); }); return out; };
  // Un título que cruza y va por debajo de las columnas (pie de página) se queda al final
  const yIni = Math.min(...[...izq, ...der].map(x=>x.y));
  return [...orden(arriba.filter(x=>x.y<=yIni)), "", ...orden(izq), "", ...orden(der), "", ...orden(arriba.filter(x=>x.y>yIni))].join("\n");
}
// Errores típicos al leer letras en un patrón: «(l2)» es «(12)» y «(3O)» es «(30)»
// Con el ruso cargado, en un patrón en español a veces lee «тр» por «mp» o «о» cirílica por «o»
const PARECIDAS = {"а":"a","е":"e","о":"o","р":"p","с":"c","у":"y","х":"x","т":"m","м":"m","к":"k","і":"i","А":"A","Е":"E","О":"O","Р":"P","С":"C","Т":"T","М":"M","К":"K","Х":"X","Н":"H","В":"B"};
function arreglarLectura(t){
  const cir = (t.match(/[а-яё]/gi)||[]).length, lat = (t.match(/[a-záéíóúñ]/gi)||[]).length;
  if(cir && cir < (cir+lat)*.05) t = t.replace(/[\u0400-\u04FF]+/g, w => [...w].every(c=>PARECIDAS[c]) ? [...w].map(c=>PARECIDAS[c]).join("") : w);
  return t.replace(/[‘’`´]/g, "'").replace(/[“”]/g, '"')
    .replace(/\*([^*"]{2,60})"(?=\s*[xх×])/g, "*$1*")
    .replace(/(^|[\s,(*])[lI|]\s?(?=(au|aum|mp|pb|pa|dis|dism|cad|var|mv|mpa)\b)/g, (m, a) => a+"1 ")
    .replace(/\(\s*([\dlIOo|]{1,4})\s*\)/g, (m, n) => /\d/.test(n) ? "("+n.replace(/[lI|]/g,"1").replace(/[Oo]/g,"0")+")" : m)
    .replace(/\b(vueltas?|rnds?|rounds?|rows?|filas?|hileras?)\s+([lI|])(?=\s*[:.)\-–])/gi, "$1 1")
    .replace(/[ \t]+\n/g, "\n");
}

function tituloDeArchivo(nombre){

}

let fotoTmp = null;
VISTAS.foto = V => {
  const cv = h("canvas",{class:"canvasprev", width:10, height:10});
  const colsSel = h("select",{id:"fo-cols"}, [20,30,40,50,60,80].map(n=>h("option",{value:n, selected:n===40}, n+" puntos de ancho")));
  const nColSel = h("select",{id:"fo-ncol"}, [2,3,4,5,6,8].map(n=>h("option",{value:n, selected:n===5}, n+" colores")));
  const info = h("p",{class:"muted"});
  const crear = h("button",{class:"primary big", disabled:true},"Crear el gráfico");
  const usados = h("div",{class:"row"});
  const vacio = h("div",{class:"empty"}, h("p",{class:"muted"},"Aquí verás cómo queda, cuadradito a cuadradito."));
  let resultado = null;
  function procesar(){
    if(!fotoTmp) return;
    const cols = +colsSel.value, filas = Math.max(4, Math.min(120, Math.round(cols * fotoTmp.height / fotoTmp.width)));
    const c = document.createElement("canvas"); c.width=cols; c.height=filas;
    const cx = c.getContext("2d"); cx.drawImage(fotoTmp,0,0,cols,filas);
    const px = cx.getImageData(0,0,cols,filas).data;
    const RGB = LANAS.map(([hex])=>[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]);
    const dist=(a,b)=>{ const rm=(a[0]+b[0])/2; return (2+rm/256)*(a[0]-b[0])**2 + 4*(a[1]-b[1])**2 + (2+(255-rm)/256)*(a[2]-b[2])**2; };
    const cerca=(p,idx)=>{ let best=idx[0], bd=Infinity; for(const i of idx){ const d=dist(p,RGB[i]); if(d<bd){bd=d; best=i;} } return best; };
    const todosIdx = RGB.map((_,i)=>i), cuenta = Array(RGB.length).fill(0), pixeles=[];
    for(let i=0;i<cols*filas;i++){ const a=px[i*4+3]; const p = a<40 ? [242,238,230] : [px[i*4],px[i*4+1],px[i*4+2]]; pixeles.push(p); cuenta[cerca(p,todosIdx)]++; }
    const elegidos = todosIdx.sort((a,b)=>cuenta[b]-cuenta[a]).slice(0,+nColSel.value).filter(i=>cuenta[i]>0);
    const idx = pixeles.map(p=>cerca(p,elegidos));
    cv.width=cols; cv.height=filas;
    const out = cv.getContext("2d"), im = out.createImageData(cols,filas);
    idx.forEach((k,i)=>{ im.data[i*4]=RGB[k][0]; im.data[i*4+1]=RGB[k][1]; im.data[i*4+2]=RGB[k][2]; im.data[i*4+3]=255; });
    out.putImageData(im,0,0);
    resultado = {cols, filas, idx}; cv.hidden=false; vacio.hidden=true;
    usados.replaceChildren(...elegidos.map(i=>h("span",{class:"chip", style:"display:inline-flex;gap:.4rem;align-items:center"}, h("span",{class:"lana", style:"background:"+LANAS[i][0]+";width:1rem;height:1rem"}), LANAS[i][1])));
    info.textContent = cols+" puntos × "+filas+" vueltas = "+(cols*filas)+" puntos en total.";
    crear.disabled=false;
  }
  colsSel.onchange=procesar; nColSel.onchange=procesar;
  crear.onclick=()=>{
    if(!resultado) return;
    const {cols, filas, idx} = resultado;
    // La fila de abajo de la foto es la vuelta 1
    const celdas = Array.from({length:filas}, (_,r)=>Array.from({length:cols}, (_,c)=>"pb@"+idx[(filas-1-r)*cols+c]));
    const g = nuevoGrafico({nombre:"Mi tapiz", vista:"filas", modo:"color", cols, celdas});
    toast("Gráfico creado"); go({name:"grafico", id:g.id});
  };
  const elegir = h("button",{class:"teal big", onclick:()=>{
    const inp = h("input",{type:"file", accept:"image/*", style:"display:none"});
    inp.onchange = async ()=>{ const f=inp.files[0]; inp.remove(); if(!f) return; try{ fotoTmp = await leerImagen(f); procesar(); }catch(e){ toast("No he podido abrir esa foto."); } };
    document.body.append(inp); inp.click();
  }}, icono("foto"), "Elegir una foto o dibujo");
  V.append(
    volver("Gráficos", {name:"graficos"}),
    h("div",{class:"page-title"}, h("h1",{},"De foto a gráfico"), h("p",{class:"muted"},"Convierte una foto o un dibujo en un gráfico de colores para tejer en tapiz (punto bajo cambiando de color) o en C2C. Funciona mejor con dibujos sencillos y pocos colores.")),
    h("div",{class:"section"},
      elegir,
      h("div",{class:"two"}, h("label",{class:"f"},"Tamaño", colsSel), h("label",{class:"f"},"Colores de lana", nColSel)),
      vacio,
      cv, usados, info, crear,
      h("div",{class:"note"},"Cada cuadradito es un punto bajo. Después puedes retocar cualquier punto a mano en el gráfico.")
    )
  );
  if(fotoTmp) requestAnimationFrame(procesar); else cv.hidden=true;
};

class ErrorNube extends Error { constructor(estado, msg){ super(msg||("nube "+estado)); this.estado = estado; } }
// Una llamada al servidor, con la sesión si la hay. Se corta a los 20 s para no dejar la pantalla colgada.
async function llamar(ruta, {metodo="GET", cuerpo, cabeceras={}, sinSesion=false, crudo=false}={}){
  const c = {apikey:NUBE.clave, ...cabeceras};
  if(!sinSesion){ const t = await token(); if(!t) throw new ErrorNube(401, "sin sesión"); c.Authorization = "Bearer "+t; }
  let body = cuerpo;
  if(cuerpo!==undefined && !(cuerpo instanceof Blob)){ c["Content-Type"] = "application/json"; body = JSON.stringify(cuerpo); }
  const ctl = new AbortController(), corte = setTimeout(()=>ctl.abort(), 20000);
  let r;
  try{ r = await fetch(NUBE.url+ruta, {method:metodo, headers:c, body, signal:ctl.signal}); }
  catch(e){ throw new ErrorNube(0, "sin conexión"); }
  finally{ clearTimeout(corte); }
  if(!r.ok){ let m=""; try{ const j = await r.json(); m = j.msg || j.message || j.error_description || j.error || ""; }catch(e){} throw new ErrorNube(r.status, m); }
  if(crudo) return r;
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
// La sesión dura una hora; antes de que caduque se renueva sola
var renovando = null;
async function token(){
  if(!sesion) return null;
  if(sesion.exp - Date.now() > 60000) return sesion.access;
  if(!renovando) renovando = (async ()=>{
    try{ guardarSesion(sesionDe(await llamar("/auth/v1/token?grant_type=refresh_token", {metodo:"POST", cuerpo:{refresh_token:sesion.refresh}, sinSesion:true}))); }
    catch(e){ if(e.estado>=400 && e.estado<500){ guardarSesion(null); render(); } else throw e; }
    finally{ renovando = null; }
  })();
  await renovando;
  return sesion ? sesion.access : null;
}

async function leerVueltaDeEntrar(){
  const hs = location.hash||"";
  if(!/^#(access_token|error)=|&(access_token|error)=/.test(hs)) return false;
  const q = new URLSearchParams(hs.slice(1));
  try{ history.replaceState(history.state, "", location.pathname+location.search); }catch(e){}
  if(q.get("error")){ toast(q.get("error_code")==="otp_expired" ? "Ese enlace ya ha caducado. Pide otro código." : "No he podido entrar. Prueba otra vez."); return true; }
  const access = q.get("access_token"), refresh = q.get("refresh_token");
  if(!access || !refresh) return true;
  try{
    const u = await llamar("/auth/v1/user", {cabeceras:{Authorization:"Bearer "+access}, sinSesion:true});
    guardarSesion({access, refresh, exp:Date.now()+(+q.get("expires_in")||3600)*1000, uid:u.id, email:u.email||""});
    await alEntrar(); go({name:"comunidad"}, true); toast("¡Ya has entrado!");
  }catch(e){ toast("No he podido entrar. Prueba otra vez."); }
  return true;
}

VISTAS.copia = V => {
  const msg = h("p",{class:"muted","aria-live":"polite"});
  let pendiente = null;
  const confirmar = h("div",{class:"stack", hidden:true});
  const nombreCopia = ext => "ganchillo-copia-"+new Date().toISOString().slice(0,10)+ext;
  function datosCopia(){
    const fotos = {}; for(const id of Object.keys(state.conFoto)){ const f=fotoGet(id); if(f) fotos[id]=f; }
    return JSON.stringify({app:"rincon-ganchillo", version:1, fecha:new Date().toISOString(), state, fotos});
  }
  // Fuera del móvil: la copia se manda por WhatsApp, correo o a Drive con el menú de compartir del sistema.
  // Va como texto (.txt) porque los móviles no dejan compartir archivos .json; «Recuperar una copia» lo lee igual.
  const archivoCopia = () => new File([datosCopia()], nombreCopia(".txt"), {type:"text/plain"});
  const puedeEnviar = (()=>{ try{ return !!(navigator.canShare && navigator.canShare({files:[new File(["x"], "a.txt", {type:"text/plain"})]})); }catch(e){ return false; } })();
  async function enviarCopia(){
    try{ await navigator.share({files:[archivoCopia()], title:"Copia de Tejiendo Ilusiones"}); copiaHecha(); msg.textContent="Copia enviada. Guárdala donde la encuentres (por ejemplo, mándatela a ti misma)."; }
    catch(e){ if(e && e.name==="AbortError") return; msg.textContent="No se pudo enviar. Prueba con «Guardar una copia»."; }
  }
  async function exportar(){
    const datos = datosCopia();
    try{
      const dl = window.claude?.use ? await claude.use("downloads") : null;
      if(dl){ await dl.save({filename:nombreCopia(".json"), data:datos}); copiaHecha(); msg.textContent="Copia guardada. Guárdala en un sitio seguro."; return; }
    }catch(e){ if(e && e.code==="declined") return; }
    if(window.TI_LOCAL){ // en la versión instalable el navegador sí deja descargar
      const url = URL.createObjectURL(new Blob([datos], {type:"application/json"}));
      const a = h("a",{href:url, download:nombreCopia(".json"), hidden:true});
      document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 10000);
      copiaHecha(); msg.textContent="Copia guardada en Descargas. Guárdala en un sitio seguro."; return;
    }
    copiaHecha(); msg.textContent="No se puede descargar aquí. Copia este texto y guárdalo:";
    V.append(h("textarea",{readonly:true, style:"min-height:8rem"}, datos));
  }
  function importar(){
    const inp = h("input",{type:"file", accept:".json,application/json,text/plain", style:"display:none"});
    inp.onchange = ()=>{ const f=inp.files[0]; inp.remove(); if(!f) return; const r=new FileReader(); r.onload=()=>{
      try{ const d=JSON.parse(r.result); if(!d || !d.state || !Array.isArray(d.state.patrones)) throw 0; pendiente=d;
        confirmar.hidden=false; confirmar.replaceChildren(h("div",{class:"note"},"Esta copia tiene "+d.state.patrones.length+" patrones tuyos, "+(d.state.graficos||[]).length+" gráficos y "+(d.state.lanas||[]).length+" lanas. Si la recuperas, sustituye lo que hay ahora en este aparato."),
          h("div",{class:"row"}, h("button",{class:"primary", onclick:()=>recuperarCopia(pendiente)},"Recuperar esta copia"), h("button",{onclick:()=>{ confirmar.hidden=true; pendiente=null; }},"Cancelar")));
      }catch(e){ msg.textContent="Ese archivo no es una copia de esta app."; } }; r.readAsText(f); };
    document.body.append(inp); inp.click();
  }
  V.append(
    volver("Más", {name:"mas"}),
    h("div",{class:"page-title"}, h("h1",{},"Copia de seguridad"), h("p",{class:"muted"},"Todo se guarda solo en este aparato. Haz una copia de vez en cuando por si cambias de móvil o se borra el navegador.")),
    h("div",{class:"section"},
      h("button",{class:"primary big", onclick:exportar}, icono("guardar"), "Guardar una copia"),
      puedeEnviar ? h("button",{class:"big", onclick:enviarCopia}, icono("corazon"), "Enviarla por WhatsApp o correo") : null,
      h("button",{class:"big", onclick:importar},"Recuperar una copia"),
      msg, confirmar)
  );
};

// Recuperar una copia sustituye todo: antes se aparta lo que había, por si era la copia equivocada
function recuperarCopia(d){
  const antes = JSON.stringify(state), fotosAntes = {};
  for(const id of Object.keys(d.fotos||{})){ const f = fotoGet(id); if(f) fotosAntes[id] = f; }
  try{ localStorage.setItem(KEY+"-antes-de-recuperar", antes); }catch(e){}
  state = Object.assign({patrones:[],progreso:{},graficos:[],lanas:[],labores:[],conFoto:{},libre:{vueltas:0,puntos:0},escala:1}, d.state); normalizarEstado();
  for(const [id,img] of Object.entries(d.fotos||{})) if(typeof img==="string" && img.startsWith("data:image/")) fotoSet(id,img);
  save(); applyScale(); go({name:"inicio"});
  toast("Copia recuperada", ()=>{
    state = JSON.parse(antes); normalizarEstado();
    for(const id of Object.keys(d.fotos||{})) fotoSet(id, fotosAntes[id] || null);
    for(const id of Object.keys(fotosAntes)) state.conFoto[id] = true;
    save(); applyScale(); render(); toast("Todo está como antes");
  });
}

// ---------- Herramientas ----------
function copiarTexto(txt, btn){
  const ok=()=>{ const t=btn.textContent; btn.textContent="Copiado ✓"; setTimeout(()=>btn.textContent=t,1500); };
  try{ navigator.clipboard.writeText(txt).then(ok).catch(()=>toast("No se pudo copiar. Mantén el dedo sobre el texto para copiarlo.")); }catch(e){ toast("No se pudo copiar. Mantén el dedo sobre el texto para copiarlo."); }
}
function numInput(id, val, label){ return h("label",{class:"f"}, label, h("input",{type:"text", inputmode:"decimal", id, value:String(val)})); }
function num(el){ return parseFloat(String(el.querySelector("input").value).replace(",", ".")); }
VISTAS.herramientas = V => {
  const selP = h("select",{id:"ci-punto"}, [["pb","Punto bajo (empieza con 6)"],["mpa","Medio punto alto (empieza con 8)"],["pa","Punto alto (empieza con 12)"]].map(([v,t])=>h("option",{value:v},t)));
  const selV = h("select",{id:"ci-vueltas"}, Array.from({length:18},(_,i)=>i+3).map(n=>h("option",{value:n, selected:n===8},n+" vueltas")));
  const prev = h("div",{class:"gridwrap", style:"cursor:default"});
  const lista = h("ol",{class:"steps"});
  let gTmp;
  function generar(){
    const L = textoCirculo(selP.value, +selV.value);
    gTmp = {nombre:"Círculo de "+NOMBRE[selP.value].toLowerCase(), vista:"redondo", modo:"simbolos", cols:10, celdas:[], texto:L.join("\n")};
    graficoDesdeTexto(gTmp, gTmp.texto, false);
    prev.replaceChildren(dibujarGrafico(gTmp, {ancho: Math.min((prev.clientWidth||340)-20, 520)}).svg);
    lista.replaceChildren(...L.map((t,i)=>h("li",{}, h("b",{},String(i+1)), h("span",{},t))));
  }
  selP.onchange=generar; selV.onchange=generar;
  const tengo = numInput("rep-tengo", 30, "Tengo (puntos)"), quiero = numInput("rep-quiero", 36, "Quiero (puntos)");
  const res = h("p",{class:"result"});
  const calc = ()=>{ res.textContent = repartir(num(tengo), num(quiero)); };
  tengo.oninput=calc; quiero.oninput=calc;
  const mP = numInput("mu-p", 16, "Puntos en 10 cm"), mV = numInput("mu-v", 18, "Vueltas en 10 cm");
  const mW = numInput("mu-w", 50, "Ancho que quiero (cm)"), mH = numInput("mu-h", 60, "Largo que quiero (cm)");
  const mS = h("select",{id:"mu-s"}, [["1","Punto bajo"],["2","Medio punto alto"],["3","Punto alto"]].map(([v,t])=>h("option",{value:v},t)));
  const mRes = h("div",{class:"result"});
  const calcM = ()=>{
    const p=num(mP), v=num(mV), w=num(mW), l=num(mH);
    if(!(p>0&&v>0&&w>0&&l>0)){ mRes.textContent="Rellena los cuatro números."; return; }
    const pts=Math.round(p*w/10), vts=Math.round(v*l/10), cad=pts+(+mS.value);
    mRes.replaceChildren(h("div",{},"Monta ", h("strong",{},cad+" cadenetas"), " (los "+pts+" puntos más "+mS.value+" para subir)."), h("div",{},"Teje unas ", h("strong",{},vts+" vueltas"), " para llegar a "+l+" cm."));
  };
  [mP,mV,mW,mH].forEach(x=>x.oninput=calcM); mS.onchange=calcM;
  const AGUJAS = [["2 – 2,5 mm","B-1 / C-2","Hilo fino, amigurumi"],["3 – 3,5 mm","D-3 / E-4","Algodón fino, bebé"],["4 – 4,5 mm","G-6 / 7","Lana media fina (DK)"],["5 – 5,5 mm","H-8 / I-9","Lana media (worsted, aran)"],["6 – 7 mm","J-10 / K-10½","Lana gruesa"],["8 – 10 mm","L-11 / N-15","Lana muy gruesa, trapillo fino"],["12 – 15 mm","P / Q","Trapillo, XXL"]];
  function crearCirculo(){
    const g = nuevoGrafico(JSON.parse(JSON.stringify(gTmp)));
    const pasos = [...g.texto.split("\n"), "Corta el hilo, pásalo por el último punto y esconde las hebras."];
    const p = {id:"m-"+Date.now(), titulo:g.nombre, descripcion:"Círculo plano de "+(+selV.value)+" vueltas.", nivel:"Fácil", hilo:"", ganchillo:"", notas: selP.value==="pa" ? "Empieza cada vuelta con 3 cad (cuentan como 1 pa) y ciérrala con 1 pd en la 3ª cad." : (selP.value==="mpa" ? "Empieza cada vuelta con 2 cad y ciérrala con 1 pd." : "Teje en espiral y marca el principio de cada vuelta con un marcador o un hilo de otro color."), pasos, color:COLORES[state.patrones.length % COLORES.length], grafico:g.id};
    state.patrones.unshift(p); save(); return p;
  }
  const secRep = h("div",{class:"section", id:"repartir"},
      h("h2",{},"Repartir aumentos o disminuciones"),
      h("p",{},"Dime cuántos puntos tienes y cuántos quieres, y te digo cómo repartirlos por igual en una vuelta."),
      h("div",{class:"panel"}, h("div",{class:"two"}, tengo, quiero), res, h("button",{style:"align-self:flex-start", onclick:e=>copiarTexto(res.textContent, e.currentTarget)},"Copiar")));
  const secMu = h("div",{class:"section", id:"muestra"},
      h("h2",{},"Calcular con la muestra"),
      h("p",{},"Teje un cuadradito de prueba de unos 12 cm, mide cuántos puntos y vueltas entran en 10 cm y te digo cuántas cadenetas montar."),
      h("div",{class:"panel"}, h("div",{class:"two"}, mP, mV), h("div",{class:"two"}, mW, mH), h("label",{class:"f"},"Punto que vas a usar", mS), mRes));
  V.append(
    volver("Más", {name:"mas"}),
    h("div",{class:"page-title"}, h("h1",{},"Herramientas"), h("p",{class:"muted"},"Calculadoras para que las cuentas salgan solas.")),
    h("div",{class:"section"},
      h("h2",{},"Círculo plano perfecto"),
      h("p",{},"Para posavasos, alfombras, fondos de cestas o mandalas. Los aumentos se alternan de sitio para que salga redondo y no hexagonal."),
      h("div",{class:"two"}, h("label",{class:"f"},"Punto", selP), h("label",{class:"f"},"Tamaño", selV)),
      prev, h("div",{class:"panel"}, lista),
      h("div",{class:"note"},"Si el círculo se ondula, sobran aumentos o el ganchillo es grande. Si se curva como un cuenco, faltan aumentos: prueba un ganchillo más grueso."),

    ),

  requestAnimationFrame(()=>{ generar(); calc(); calcM(); if(view.ancla){ const el=document.getElementById(view.ancla); el && el.scrollIntoView({block:"start"}); } });
