// ---------- Importar un patrón pegado ----------
// Todo con reglas, sin IA y sin conexión: limpia el texto, separa las vueltas,
// traduce del inglés (términos de EE. UU. o del Reino Unido) y revisa cada línea.
const PUNTOS_EN = {
  us: {"sl st":"pd", "slst":"pd", "ss":"pd", "ch":"cad", "sc":"pb", "hdc":"mpa", "dc":"pa", "tr":"pad", "trc":"pad", "inc":"aum", "dec":"dism", "sc2tog":"dism", "invdec":"dism", "dc2tog":"dism"},
  uk: {"sl st":"pd", "slst":"pd", "ss":"pd", "ch":"cad", "dc":"pb", "htr":"mpa", "tr":"pa", "dtr":"pad", "inc":"aum", "dec":"dism", "dc2tog":"dism", "invdec":"dism"}
};
const PALABRAS_EN = {the:"", a:"", an:"", into:"en", in:"en", to:"hasta", space:"espacio", sp:"espacio", corner:"esquina", ring:"anillo", ball:"bola", same:"mismo", next:"siguiente", more:"más", with:"con", first:"primer", last:"último", end:"final", beginning:"principio", each:"cada", and:"y", then:"después", of:"de"};
const RX_PUNTO_EN = /\b(sl ?st|sc2tog|dc2tog|invdec|hdc|htr|dtr|trc|sc|dc|tr|ss|ch|inc|dec)\b/gi;
function esIngles(texto){
  const en = (texto.match(/\b(sc|dc|hdc|htr|ch|rnds?|rounds?|stitch(es)?|sts|sl ?st|magic ring|repeat|each|around|fasten off)\b/gi)||[]).length;
  const es = (texto.match(/\b(pb|pa|mpa|cad|vueltas?|puntos?|cadenetas?|aumentos?|anillo)\b/gi)||[]).length;
  return en >= 2 && en > es;
}
function esUK(texto){ return /\b(htr|dtr|uk terms?|british)\b/i.test(texto) || (/\bdc\b/i.test(texto) && /\btr\b/i.test(texto) && !/\bsc\b/i.test(texto)); }
function traducirIngles(linea, uk){
  const mapa = PUNTOS_EN[uk ? "uk" : "us"];
  let t = " "+linea+" ";
  t = t.replace(/(\d)(sc|dc|hdc|htr|ch|tr|dtr)\b/gi, "$1 $2")                                      // 2sc → 2 sc
       .replace(/[\[(]([^\])]*[a-z][^\])]*)[\])]\s*(?:x\s*(\d+)|(\d+)\s*times)/gi, "*$1* repetir $2$3 veces") // (sc, inc) x6
       .replace(/\*([^*]+?)[;,]?\s*rep(?:eat)? from \*\s*(\d+)\s*more times/gi, (m,a,n)=>"*"+a+"* repetir "+(+n+1)+" veces")
       .replace(/\*([^*]+?)[;,]?\s*rep(?:eat)? from \*\s*(\d+)\s*times/gi, "*$1* repetir $2 veces")
       .replace(/\*([^*]+?)[;,]?\s*rep(?:eat)? from \*\s*(around|to end|across)?/gi, "*$1* ")
       .replace(/\b(sc|dc|hdc|htr|tr|dtr)\s+in\s+(?:the\s+)?next\s+(\d+)\s*(?:sts?|stitches)?\b/gi, "$2 $1") // sc in next 3 sts
       .replace(/\b(ch|sc|dc|hdc|htr|tr|dtr)\s+(\d+)\b(?!\s*(?:sts?|stitches|times))/gi, "$2 $1")       // ch 3 → 3 ch
       .replace(/[\[(]\s*(\d+)\s*(?:sts?|stitches|puntos)?\s*[\])]/gi, "($1)")                            // [12] / (12 sts)
       .replace(/\s[-–—=]\s*(\d+)\s*(?:sts?|stitches)\.?\s*$/i, " ($1) ");                                  // – 12 sts
  t = t.replace(/\b(rnds|rounds|rows)\s*(\d+)\s*(?:-|–|to|and|&)\s*(\d+)/gi, "Vueltas $2 al $3")
       .replace(/\b(rnd|round|row|r)\s*(\d+)/gi, "Vuelta $2")
       .replace(/\b(join|close)( the round)? with (a )?(sl ?st|ss)\b/gi, "cierra con pd")
       .replace(/\b(magic (ring|circle|loop)|mr)\b/gi, "anillo mágico")
       .replace(/\b(fasten off|fo)\b/gi, "corta el hilo")
       .replace(/\bweave in (the |all )?ends\b/gi, "esconde las hebras")
       .replace(/\bstuff(ing)?\b/gi, "rellena")
       .replace(/\bturn\b/gi, "gira")
       .replace(/\bcounts? as (a |one |1 )?/gi, "cuenta como 1 ")
       .replace(/\b(back loop only|blo)\b/gi, "por la hebra de atrás")
       .replace(/\b(front loop only|flo)\b/gi, "por la hebra de delante")
       .replace(/\bin (each|every) (st|stitch|sc|dc|ch|ch-sp)\b/gi, "en cada punto")
       .replace(/\bin (the )?same (st|stitch)\b/gi, "en el mismo punto")
       .replace(/\bin (the )?next (st|stitch)\b/gi, "en el siguiente")
       .replace(/\b(sk|skip)\b/gi, "salta");
  t = t.replace(RX_PUNTO_EN, m => mapa[m.toLowerCase().replace(/\s+/," ")] || m);
  t = t.replace(/\b(repeat|rep)\b/gi, "repetir").replace(/\btimes\b/gi, "veces").replace(/\b(all )?around\b/gi, "alrededor")
       .replace(/\b(stitches|sts)\b/gi, "puntos").replace(/\bst\b/gi, "punto");
  t = t.replace(/\b(the|a|an|into|in|to|space|sp|corner|ring|ball|same|next|more|with|first|last|end|beginning|each|and|then|of)\b/gi, m => PALABRAS_EN[m.toLowerCase()]);
  t = t.replace(/\s+/g, " ").trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}
const RX_VUELTA = /^(?:vueltas?|v|rnds?|rounds?|rows?|r|filas?)\s*\d+/i;
function limpiarPegado(texto){
  let t = (texto||"").replace(/\r/g, "").replace(/ /g, " ").replace(/[•●▪◦]\s*/g, "").replace(/[ \t]+/g, " ");
  // Separa las vueltas que vienen pegadas en un mismo párrafo
  t = t.replace(/([^\n])\s+(?=(?:vueltas?|rnds?|rounds?|rows?|r)\s*\d+\s*(?:(?:-|–|a|to)\s*\d+\s*)?[:.)])/gi, "$1\n");
  const lineas = [];
  for(let l of t.split("\n")){
    l = l.trim();
    if(!l || /^[\W_]+$/.test(l) || /^(https?:\/\/|www\.)/i.test(l) || /^(©|copyright|p[aá]g(ina)?\.? ?\d+$|page \d+$)/i.test(l)) continue;
    const prev = lineas[lineas.length-1];
    if(prev && (/^[a-záéíóúñ(]/.test(l) || /[,;]$/.test(prev)) && !RX_VUELTA.test(l)) lineas[lineas.length-1] = prev+" "+l; // línea cortada
    else lineas.push(l);
  }
  return lineas;
}
// ¿Es una instrucción para tejer (y no materiales, notas o el título)?
function esPaso(l){ if(/^(materials?|materiales|yarn|hook|gauge|notes?|abbreviations|size|lana|hilo|ganchillo|necesitas|tension|muestra)\b/i.test(l)) return false; return RX_VUELTA.test(l) || lineaAFilas(l).length>0 || /\b(haz|teje|monta|anillo|corta|esconde|rellena|cose|remata|cierra)\b/i.test(l); }
function revisarLinea(t){
  const filas = lineaAFilas(t), info = infoPaso(t);
  if(!filas.length) return /\b(pb|pa|mpa|pad|aum|dism)\b/i.test(t) ? {estado:"duda"} : {estado:"texto"};
  let n = filas[0].reduce((a,k)=>a+anchoDe(k),0);
  if(/cuentan? como (1|un) (pa|mpa|pad|punto)/i.test(t)) n++;
  if(!info.objetivo || info.unidad!=="puntos") return {estado:"ok", n};
  if(n===info.objetivo) return {estado:"cuadra", n, obj:info.objetivo};
  // Las cadenetas de subida a veces cuentan como punto y a veces no: una diferencia pequeña no es un error
  if(/^[^a-z]*(vueltas?\s*[\d\sa]+:)?\s*\d+\s*cad/i.test(t) && Math.abs(n-info.objetivo)<=2) return {estado:"ok", n:info.objetivo};
  return {estado:"distinto", n, obj:info.objetivo};
}
function importarTexto(texto, uk){
  const ingles = esIngles(texto);
  if(uk==null) uk = ingles && esUK(texto);
  const originales = limpiarPegado(texto);
  const lineas = originales.map(l => ingles ? traducirIngles(l, uk) : l);
  // La primera línea corta y sin números es el título, aunque nombre puntos («Bufanda de punto bajo»)
  const conTitulo = originales.length>1 && originales[0].length<=60 && !/\d|:/.test(originales[0]) && !/^(haz|teje|monta|make|chain|start)\b/i.test(originales[0]);
  const desde = conTitulo ? 1 : 0;
  let primero = lineas.slice(desde).findIndex(esPaso); if(primero>=0) primero += desde;
  const antes = primero<0 ? originales : originales.slice(0, primero); // título y materiales, sin traducir
  const pasos = primero<0 ? [] : lineas.slice(primero);
  const tituloLinea = conTitulo ? originales[0] : antes.find(l => l.length<=60 && !/\d\s*mm|:/.test(l));
  // El grosor del ganchillo: mejor el que va junto a «ganchillo» o «hook» que el de la lana
  const gan = texto.match(/(?:ganchillo|aguja|hook|crochet)[^\n\d]{0,25}(\d+(?:[.,]\d+)?)\s*mm\b/i) || texto.match(/(\d+(?:[.,]\d+)?)\s*mm\b[^\n]{0,4}(?:ganchillo|hook)?/i);
  return {
    ingles, uk, pasos,
    revision: pasos.map(revisarLinea),
    titulo: tituloLinea || "",
    ganchillo: gan ? gan[1].replace(".", ",")+" mm" : "",
    notas: antes.filter(l => l!==tituloLinea).join("\n")
  };
}

// ---------- Leer PDF y fotos (en el propio móvil, sin enviar nada a ningún servidor) ----------
const cargando = {};
function cargarScript(src){
  return cargando[src] = cargando[src] || new Promise((ok, mal)=>{
    const sc = document.createElement("script"); sc.src = src;
    sc.onload = ok; sc.onerror = ()=>{ delete cargando[src]; sc.remove(); mal(new Error("sin-conexion")); };
    document.head.append(sc);
  });
}
// En la versión instalable (window.TI_LOCAL) las librerías van junto a la app, en lib/, para funcionar sin conexión
const PDFJS = window.TI_LOCAL ? "lib/" : "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const TESSERACT = window.TI_LOCAL ? "lib/tesseract.min.js" : "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
// Los datos para leer letras (unos 9 MB) se publican junto a la app en ocr/ y se guardan en el móvil tras el primer uso
const OCR_DIR = new URL("ocr/", location.href).href;
async function abrirPDF(datos){
  await cargarScript(PDFJS+"pdf.min.js");
  await cargarScript(PDFJS+"pdf.worker.min.js"); // sin worker aparte: corre en la página
  // isEvalSupported:false evita ejecutar código de las fuentes del PDF (CVE-2024-4367)
  return window.pdfjsLib.getDocument({data:datos, isEvalSupported:false, disableFontFace:true, useSystemFonts:false}).promise;
}
// Junta los trozos de texto de cada página en líneas, según su altura en la hoja
async function textoDePDF(doc){
  const paginas = [];
  for(let n=1; n<=doc.numPages; n++){
    const pag = await doc.getPage(n), cont = await pag.getTextContent();
    let lineas = [], linea = "", y = null, finX = null;
    for(const it of cont.items){
      if(typeof it.str!=="string") continue;
      const iy = it.transform[5], ix = it.transform[4], alto = Math.abs(it.transform[3]) || it.height || 10;
      if(y!==null && Math.abs(iy-y) > alto*0.5){ lineas.push(linea); linea = ""; finX = null; }
      else if(finX!==null && it.str && ix-finX > alto*0.15 && !/\s$/.test(linea) && !/^\s/.test(it.str)) linea += " ";

      if(it.hasEOL){ lineas.push(linea); linea = ""; y = null; finX = null; }
    }
    if(linea) lineas.push(linea);

async function paginasComoImagen(doc, max){
  const imgs = [];
  for(let n=1; n<=Math.min(doc.numPages, max); n++){
    const pag = await doc.getPage(n), vp0 = pag.getViewport({scale:1});
    const vp = pag.getViewport({scale: Math.min(3, 2000/Math.max(vp0.width, vp0.height))});
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
    await pag.render({canvasContext:ctx, viewport:vp}).promise;
    imgs.push(c); pag.cleanup();
  }
  return imgs;
}
// Las fotos del móvil son enormes: se reducen a un tamaño que se lee igual de bien y mucho más rápido
async function prepararFoto(archivo){
  const bmp = await createImageBitmap(archivo);
  const k = Math.min(1, 2400/Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  return c;
}
async function leerImagenes(imgs, avisar){
  await cargarScript(TESSERACT);
  // Comprueba que los datos del lector están publicados junto a la app antes de arrancarlo
  const prueba = await fetch(OCR_DIR+"worker.min.js", {method:"HEAD"}).catch(()=>null);
  if(!prueba || !prueba.ok) throw new Error("no-arranca");
  let actual = 0;
  // Si el lector no llega a arrancar (sin red, móvil muy antiguo) no se queda esperando para siempre
  let plazo; const tarde = new Promise((_, mal)=>{ plazo = setTimeout(()=>mal(new Error("no-arranca")), 120000); });
  const worker = await Promise.race([tarde, window.Tesseract.createWorker(["spa","eng"], 1, {
    workerPath: OCR_DIR+"worker.min.js", corePath: OCR_DIR, langPath: OCR_DIR, workerBlobURL: false,
    logger: m => { if(m.status==="recognizing text") avisar("Leyendo"+(imgs.length>1?" la página "+(actual+1)+" de "+imgs.length:" la foto")+"…", (actual+m.progress)/imgs.length);
                   else if(/load|initializ/.test(m.status||"")) avisar("Preparando la lectura (solo tarda la primera vez)…", null); },
    errorHandler: ()=>{}
  })]).finally(()=>clearTimeout(plazo));
  try{
    const textos = [];
    for(; actual<imgs.length; actual++) textos.push((await worker.recognize(imgs[actual])).data.text);
    return arreglarLectura(textos.join("\n\n"));
  } finally { worker.terminate(); }
}
// Errores típicos al leer letras en un patrón: «(l2)» es «(12)» y «(3O)» es «(30)»
function arreglarLectura(t){
  return t.replace(/[‘’`´]/g, "'").replace(/[“”]/g, '"')
    .replace(/\(\s*([\dlIOo|]{1,4})\s*\)/g, (m, n) => /\d/.test(n) ? "("+n.replace(/[lI|]/g,"1").replace(/[Oo]/g,"0")+")" : m)
    .replace(/\b(vueltas?|rnds?|rounds?|rows?|filas?)\s+([lI|])(?=\s*[:.)\-–])/gi, "$1 1")
    .replace(/[ \t]+\n/g, "\n");
}

VISTAS.foto = V => {
  const cv = h("canvas",{class:"canvasprev", width:10, height:10});
  const colsSel = h("select",{id:"fo-cols"}, [20,30,40,50,60,80].map(n=>h("option",{value:n, selected:n===40}, n+" puntos de ancho")));
  const nColSel = h("select",{id:"fo-ncol"}, [2,3,4,5,6,8].map(n=>h("option",{value:n, selected:n===5}, n+" colores")));
  const info = h("p",{class:"muted"});
  const crear = h("button",{class:"primary big", disabled:true},"Crear el gráfico");
  const usados = h("div",{class:"row"});
  const vacio = h("div",{class:"empty"}, h("p",{class:"muted"},"Aquí verás cómo queda, cuadradito a cuadradito."));
  let resultado = null;
  function procesar(){
    if(!fotoTmp) return;
    const cols = +colsSel.value, filas = Math.max(4, Math.min(120, Math.round(cols * fotoTmp.height / fotoTmp.width)));
    const c = document.createElement("canvas"); c.width=cols; c.height=filas;
    const cx = c.getContext("2d"); cx.drawImage(fotoTmp,0,0,cols,filas);
    const px = cx.getImageData(0,0,cols,filas).data;
    const RGB = LANAS.map(([hex])=>[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]);
    const dist=(a,b)=>{ const rm=(a[0]+b[0])/2; return (2+rm/256)*(a[0]-b[0])**2 + 4*(a[1]-b[1])**2 + (2+(255-rm)/256)*(a[2]-b[2])**2; };
    const cerca=(p,idx)=>{ let best=idx[0], bd=Infinity; for(const i of idx){ const d=dist(p,RGB[i]); if(d<bd){bd=d; best=i;} } return best; };
    const todosIdx = RGB.map((_,i)=>i), cuenta = Array(RGB.length).fill(0), pixeles=[];
    for(let i=0;i<cols*filas;i++){ const a=px[i*4+3]; const p = a<40 ? [242,238,230] : [px[i*4],px[i*4+1],px[i*4+2]]; pixeles.push(p); cuenta[cerca(p,todosIdx)]++; }
    const elegidos = todosIdx.sort((a,b)=>cuenta[b]-cuenta[a]).slice(0,+nColSel.value).filter(i=>cuenta[i]>0);
    const idx = pixeles.map(p=>cerca(p,elegidos));
    cv.width=cols; cv.height=filas;
    const out = cv.getContext("2d"), im = out.createImageData(cols,filas);
    idx.forEach((k,i)=>{ im.data[i*4]=RGB[k][0]; im.data[i*4+1]=RGB[k][1]; im.data[i*4+2]=RGB[k][2]; im.data[i*4+3]=255; });
    out.putImageData(im,0,0);
    resultado = {cols, filas, idx}; cv.hidden=false; vacio.hidden=true;
    usados.replaceChildren(...elegidos.map(i=>h("span",{class:"chip", style:"display:inline-flex;gap:.4rem;align-items:center"}, h("span",{class:"lana", style:"background:"+LANAS[i][0]+";width:1rem;height:1rem"}), LANAS[i][1])));
    info.textContent = cols+" puntos × "+filas+" vueltas = "+(cols*filas)+" puntos en total.";
    crear.disabled=false;
  }
  colsSel.onchange=procesar; nColSel.onchange=procesar;
  crear.onclick=()=>{
    if(!resultado) return;
    const {cols, filas, idx} = resultado;
    // La fila de abajo de la foto es la vuelta 1
    const celdas = Array.from({length:filas}, (_,r)=>Array.from({length:cols}, (_,c)=>"pb@"+idx[(filas-1-r)*cols+c]));
    const g = nuevoGrafico({nombre:"Mi tapiz", vista:"filas", modo:"color", cols, celdas});
    toast("Gráfico creado"); go({name:"grafico", id:g.id});
  };
  const elegir = h("button",{class:"teal big", onclick:()=>{
    const inp = h("input",{type:"file", accept:"image/*", style:"display:none"});
    inp.onchange = async ()=>{ const f=inp.files[0]; inp.remove(); if(!f) return; try{ fotoTmp = await leerImagen(f); procesar(); }catch(e){ toast("No he podido abrir esa foto."); } };
    document.body.append(inp); inp.click();
  }}, icono("foto"), "Elegir una foto o dibujo");
  V.append(
    volver("Gráficos", {name:"graficos"}),
    h("div",{class:"page-title"}, h("h1",{},"De foto a gráfico"), h("p",{class:"muted"},"Convierte una foto o un dibujo en un gráfico de colores para tejer en tapiz (punto bajo cambiando de color) o en C2C. Funciona mejor con dibujos sencillos y pocos colores.")),
    h("div",{class:"section"},
      elegir,
      h("div",{class:"two"}, h("label",{class:"f"},"Tamaño", colsSel), h("label",{class:"f"},"Colores de lana", nColSel)),
      vacio,
      cv, usados, info, crear,
      h("div",{class:"note"},"Cada cuadradito es un punto bajo. Después puedes retocar cualquier punto a mano en el gráfico.")
    )
  );
  if(fotoTmp) requestAnimationFrame(procesar); else cv.hidden=true;
};

function num(el){ return parseFloat(String(el.querySelector("input").value).replace(",", ".")); }
VISTAS.herramientas = V => {
  const selP = h("select",{id:"ci-punto"}, [["pb","Punto bajo (empieza con 6)"],["mpa","Medio punto alto (empieza con 8)"],["pa","Punto alto (empieza con 12)"]].map(([v,t])=>h("option",{value:v},t)));
  const selV = h("select",{id:"ci-vueltas"}, Array.from({length:18},(_,i)=>i+3).map(n=>h("option",{value:n, selected:n===8},n+" vueltas")));
  const prev = h("div",{class:"gridwrap", style:"cursor:default"});
  const lista = h("ol",{class:"steps"});
  let gTmp;
  function generar(){
    const L = textoCirculo(selP.value, +selV.value);
    gTmp = {nombre:"Círculo de "+NOMBRE[selP.value].toLowerCase(), vista:"redondo", modo:"simbolos", cols:10, celdas:[], texto:L.join("\n")};
    graficoDesdeTexto(gTmp, gTmp.texto, false);
    prev.replaceChildren(dibujarGrafico(gTmp, {ancho: Math.min((prev.clientWidth||340)-20, 520)}).svg);
    lista.replaceChildren(...L.map((t,i)=>h("li",{}, h("b",{},String(i+1)), h("span",{},t))));
  }
  selP.onchange=generar; selV.onchange=generar;
  const tengo = numInput("rep-tengo", 30, "Tengo (puntos)"), quiero = numInput("rep-quiero", 36, "Quiero (puntos)");
  const res = h("p",{class:"result"});
  const calc = ()=>{ res.textContent = repartir(num(tengo), num(quiero)); };
  tengo.oninput=calc; quiero.oninput=calc;
  const mP = numInput("mu-p", 16, "Puntos en 10 cm"), mV = numInput("mu-v", 18, "Vueltas en 10 cm");
  const mW = numInput("mu-w", 50, "Ancho que quiero (cm)"), mH = numInput("mu-h", 60, "Largo que quiero (cm)");
  const mS = h("select",{id:"mu-s"}, [["1","Punto bajo"],["2","Medio punto alto"],["3","Punto alto"]].map(([v,t])=>h("option",{value:v},t)));
  const mRes = h("div",{class:"result"});
  const calcM = ()=>{
    const p=num(mP), v=num(mV), w=num(mW), l=num(mH);
    if(!(p>0&&v>0&&w>0&&l>0)){ mRes.textContent="Rellena los cuatro números."; return; }
    const pts=Math.round(p*w/10), vts=Math.round(v*l/10), cad=pts+(+mS.value);
    mRes.replaceChildren(h("div",{},"Monta ", h("strong",{},cad+" cadenetas"), " (los "+pts+" puntos más "+mS.value+" para subir)."), h("div",{},"Teje unas ", h("strong",{},vts+" vueltas"), " para llegar a "+l+" cm."));
  };
  [mP,mV,mW,mH].forEach(x=>x.oninput=calcM); mS.onchange=calcM;
  const AGUJAS = [["2 – 2,5 mm","B-1 / C-2","Hilo fino, amigurumi"],["3 – 3,5 mm","D-3 / E-4","Algodón fino, bebé"],["4 – 4,5 mm","G-6 / 7","Lana media fina (DK)"],["5 – 5,5 mm","H-8 / I-9","Lana media (worsted, aran)"],["6 – 7 mm","J-10 / K-10½","Lana gruesa"],["8 – 10 mm","L-11 / N-15","Lana muy gruesa, trapillo fino"],["12 – 15 mm","P / Q","Trapillo, XXL"]];
  function crearCirculo(){
    const g = nuevoGrafico(JSON.parse(JSON.stringify(gTmp)));
    const pasos = [...g.texto.split("\n"), "Corta el hilo, pásalo por el último punto y esconde las hebras."];
    const p = {id:"m-"+Date.now(), titulo:g.nombre, descripcion:"Círculo plano de "+(+selV.value)+" vueltas.", nivel:"Fácil", hilo:"", ganchillo:"", notas: selP.value==="pa" ? "Empieza cada vuelta con 3 cad (cuentan como 1 pa) y ciérrala con 1 pd en la 3ª cad." : (selP.value==="mpa" ? "Empieza cada vuelta con 2 cad y ciérrala con 1 pd." : "Teje en espiral y marca el principio de cada vuelta con un marcador o un hilo de otro color."), pasos, color:COLORES[state.patrones.length % COLORES.length], grafico:g.id};
    state.patrones.unshift(p); save(); return p;
  }
  const secRep = h("div",{class:"section", id:"repartir"},
      h("h2",{},"Repartir aumentos o disminuciones"),
      h("p",{},"Dime cuántos puntos tienes y cuántos quieres, y te digo cómo repartirlos por igual en una vuelta."),
      h("div",{class:"panel"}, h("div",{class:"two"}, tengo, quiero), res, h("button",{style:"align-self:flex-start", onclick:e=>copiarTexto(res.textContent, e.currentTarget)},"Copiar")));
  const secMu = h("div",{class:"section", id:"muestra"},
      h("h2",{},"Calcular con la muestra"),
      h("p",{},"Teje un cuadradito de prueba de unos 12 cm, mide cuántos puntos y vueltas entran en 10 cm y te digo cuántas cadenetas montar."),
      h("div",{class:"panel"}, h("div",{class:"two"}, mP, mV), h("div",{class:"two"}, mW, mH), h("label",{class:"f"},"Punto que vas a usar", mS), mRes));
  V.append(
    volver("Más", {name:"mas"}),
    h("div",{class:"page-title"}, h("h1",{},"Herramientas"), h("p",{class:"muted"},"Calculadoras para que las cuentas salgan solas.")),
    h("div",{class:"section"},
      h("h2",{},"Círculo plano perfecto"),
      h("p",{},"Para posavasos, alfombras, fondos de cestas o mandalas. Los aumentos se alternan de sitio para que salga redondo y no hexagonal."),
      h("div",{class:"two"}, h("label",{class:"f"},"Punto", selP), h("label",{class:"f"},"Tamaño", selV)),
      prev, h("div",{class:"panel"}, lista),
      h("div",{class:"note"},"Si el círculo se ondula, sobran aumentos o el ganchillo es grande. Si se curva como un cuenco, faltan aumentos: prueba un ganchillo más grueso."),
      h("div",{class:"row"},
        h("button",{class:"primary big", onclick:()=>{ const p=crearCirculo(); go({name:"patron", id:p.id}); toast("Patrón creado"); }},"Guardar como patrón"),
        h("button",{class:"big", onclick:()=>{ const g=nuevoGrafico(JSON.parse(JSON.stringify(gTmp))); go({name:"grafico", id:g.id}); }},"Abrir como gráfico"))
    ),
    secRep, secMu,
    h("div",{class:"section"},
      h("h2",{},"Ganchillos y lanas"),
      h("div",{class:"panel tablewrap"}, h("table",{}, h("thead",{}, h("tr",{}, h("th",{},"Ganchillo"), h("th",{},"Tamaño en EE. UU."), h("th",{},"Para"))),
        h("tbody",{}, AGUJAS.map(r=>h("tr",{}, r.map(c=>h("td",{},c))))))),
      h("p",{class:"muted"},"La etiqueta de la lana casi siempre dice qué ganchillo usar. Si tejes apretado, sube medio número.")
    )
  );
  requestAnimationFrame(()=>{ generar(); calc(); calcM(); if(view.ancla){ const el=document.getElementById(view.ancla); el && el.scrollIntoView({block:"start"}); } });
};

applyScale();
render();
abrirEnlaceRecibido();
</script>
